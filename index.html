<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Paradise Garden</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }
  #gc { display:block; }
  #hint {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    font-size:14px; color:rgba(255,255,255,0.85); pointer-events:none;
    background:rgba(0,0,0,0.3); padding:5px 16px; border-radius:20px;
    transition:opacity 1.2s; font-family:sans-serif;
  }
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="hint">Тяните мышью для поворота</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function(){

/* ── Data ── */
var CARDS = [
  { name:'Классический массаж',    desc:'Восстанавливает кровообращение, снимает мышечное напряжение и улучшает общий тонус тела. Идеально после тяжёлой недели.',       duration:'60 или 90 мин', price:'600 / 850 грн'  },
  { name:'Глубокотканный',         desc:'Интенсивное воздействие на глубокие слои мышц. Эффективен при хронических болях и мышечных зажимах после стресса.',           duration:'60 или 90 мин', price:'750 / 1050 грн' },
  { name:'Аромамассаж',            desc:'Мягкие техники с натуральными эфирными маслами. Успокаивает нервную систему и наполняет тело ощущением лёгкости.',             duration:'75 или 90 мин', price:'700 / 900 грн'  },
  { name:'Массаж спины и шеи',     desc:'Снимает головную боль, напряжение от сидячей работы и скованность в плечевом поясе. Результат с первого сеанса.',             duration:'30 или 45 мин', price:'400 / 550 грн'  },
  { name:'Антицеллюлитный',        desc:'Лимфодренаж и улучшение микроциркуляции. Кожа становится упругей, контуры — чётче. Курс от 8 сеансов.',                       duration:'45 или 60 мин', price:'650 / 850 грн'  },
  { name:'Спортивный массаж',      desc:'Восстановление после тренировок, профилактика травм, повышение гибкости и тонуса мышц. До и после нагрузок.',                  duration:'60 мин',        price:'700 грн'        },
];

var SOC_ICONS = [
  { href:'https://threads.net/',           src:'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/hreads.svg',   alt:'Threads'   },
  { href:'https://t.me/username',          src:'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/telegram.svg', alt:'Telegram'  },
  { href:'https://instagram.com/username', src:'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/insta.svg',    alt:'Instagram' },
  { href:'https://wa.me/380000000000',     src:'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/wa.svg',       alt:'WhatsApp'  },
  { href:'tel:+380000000000',              src:'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/call.svg',     alt:'Звонок'    },
];

/* ── Renderer ── */
var canvas = document.getElementById('gc');
var W = window.innerWidth, H = window.innerHeight;

var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.autoClear = false;

var skyScene  = new THREE.Scene();
var mainScene = new THREE.Scene();


var camera    = new THREE.PerspectiveCamera(75, W/H, 0.1, 500);
var skyCamera = new THREE.PerspectiveCamera(75, W/H, 1, 1000);
camera.position.set(0, 1.6, 0);

var loader = new THREE.TextureLoader();
loader.crossOrigin = 'anonymous';

/* ── Sky ── */
var skyGeo = new THREE.SphereGeometry(500, 64, 32);
skyGeo.scale(-1, 1, 1);
var skyMat = new THREE.ShaderMaterial({
  uniforms:{top:{value:new THREE.Color(0x2a6fbe)},bot:{value:new THREE.Color(0xb0cfe8)}},
  vertexShader:`varying vec3 vP; void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform vec3 top,bot;varying vec3 vP;void main(){float h=clamp(normalize(vP).y*2.,0.,1.);gl_FragColor=vec4(mix(bot,top,h),1.);}`
});
var skyMesh = new THREE.Mesh(skyGeo, skyMat);
skyScene.add(skyMesh);

loader.load(
  'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/main/%7B__prompt____An_equirectangular_360-degree_202606110114.jpeg',
  function(tex){
    tex.encoding = THREE.sRGBEncoding;
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    skyMesh.material = new THREE.MeshBasicMaterial({ map: tex, side: THREE.FrontSide });
  }
);

/* ── Cards ── */
var CARD_RADIUS = 5.5;   // расстояние от центра
var CARD_Y      = 1.6;   // высота на уровне глаз
var CARD_W      = 2.2;
var CARD_H      = 3.2;
var TW = 560, TH = 800;

var cardExpanded = new Array(CARDS.length).fill(false);

var socImages = SOC_ICONS.map(function(s){
  var img = new Image(); img.crossOrigin = 'anonymous'; img.src = s.src; return img;
});

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function wrapText(ctx,text,x,y,maxW,lineH){
  var words=text.split(' '), line='';
  for(var i=0;i<words.length;i++){
    var test=line+words[i]+' ';
    if(ctx.measureText(test).width>maxW&&i>0){ ctx.fillText(line.trim(),x,y); line=words[i]+' '; y+=lineH; }
    else line=test;
  }
  ctx.fillText(line.trim(),x,y);
}

// ── Gaussian blur helper (box-blur approx, runs on offscreen canvas) ──
function blurCanvas(src, radius){
  var w=src.width, h=src.height;
  var tmp=document.createElement('canvas'); tmp.width=w; tmp.height=h;
  var tc=tmp.getContext('2d');
  // 3-pass box blur ≈ gaussian
  for(var pass=0;pass<3;pass++){
    tc.clearRect(0,0,w,h);
    tc.filter='blur('+radius+'px)';
    tc.drawImage(src,0,0);
    src=tmp;
    tmp=document.createElement('canvas'); tmp.width=w; tmp.height=h;
    tc=tmp.getContext('2d');
  }
  return src;
}

// Рисует иконку белой через compositing: сначала белый прямоугольник, потом destination-in с самой иконкой
function drawWhiteIcon(ctx, img, x, y, size){
  var off=document.createElement('canvas'); off.width=size; off.height=size;
  var oc=off.getContext('2d');
  oc.fillStyle='#ffffff';
  oc.fillRect(0,0,size,size);
  oc.globalCompositeOperation='destination-in';
  oc.drawImage(img,0,0,size,size);
  ctx.drawImage(off,x,y);
}

function drawCard(cardCanvas, data, expanded){
  var ctx = cardCanvas.getContext('2d');
  ctx.clearRect(0,0,TW,TH);

  // ── Frosted glass: реальный blur ──
  // 1. Рисуем содержимое на офскрин
  var bg2=document.createElement('canvas'); bg2.width=TW; bg2.height=TH;
  var bc=bg2.getContext('2d');
  // градиентная заливка как «материал» за стеклом
  var grd=bc.createLinearGradient(0,0,TW,TH);
  grd.addColorStop(0,'rgba(180,220,180,0.85)');
  grd.addColorStop(0.5,'rgba(140,190,160,0.80)');
  grd.addColorStop(1,'rgba(100,150,120,0.85)');
  bc.fillStyle=grd; bc.fillRect(0,0,TW,TH);
  // 2. Блюрим
  var blurred=blurCanvas(bg2, 18);
  // 3. Клип по скруглённому прямоугольнику и рисуем размытый фон
  ctx.save();
  roundRect(ctx,0,0,TW,TH,60); ctx.clip();
  ctx.drawImage(blurred,0,0);
  // 4. Тонкий белый туман поверх (frosted эффект)
  var fog=ctx.createLinearGradient(0,0,0,TH);
  fog.addColorStop(0,'rgba(255,255,255,0.28)');
  fog.addColorStop(1,'rgba(255,255,255,0.10)');
  ctx.fillStyle=fog; ctx.fillRect(0,0,TW,TH);
  ctx.restore();

  // блик сверху
  ctx.save();
  roundRect(ctx,0,0,TW,TH,60); ctx.clip();
  var shine=ctx.createLinearGradient(0,0,0,TH*0.30);
  shine.addColorStop(0,'rgba(255,255,255,0.30)');
  shine.addColorStop(1,'rgba(255,255,255,0.00)');
  ctx.fillStyle=shine; ctx.fillRect(0,0,TW,TH*0.30);
  ctx.restore();

  // внешняя рамка
  ctx.strokeStyle='rgba(255,255,255,0.70)'; ctx.lineWidth=2;
  roundRect(ctx,1,1,TW-2,TH-2,59); ctx.stroke();
  // внутренняя тонкая рамка
  ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=1;
  roundRect(ctx,5,5,TW-10,TH-10,56); ctx.stroke();

  // заголовок
  ctx.fillStyle='#ffffff';
  ctx.font='bold 46px -apple-system,BlinkMacSystemFont,Helvetica,sans-serif';
  ctx.textAlign='left';
  ctx.shadowColor='rgba(0,0,0,0.55)'; ctx.shadowBlur=10;
  wrapText(ctx,data.name,44,86,TW-88,56);
  ctx.shadowBlur=0;

  // разделитель
  ctx.strokeStyle='rgba(255,255,255,0.30)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(44,128); ctx.lineTo(TW-44,128); ctx.stroke();

  // описание
  ctx.fillStyle='rgba(255,255,255,0.92)';
  ctx.font='28px -apple-system,BlinkMacSystemFont,Helvetica,sans-serif';
  ctx.shadowColor='rgba(0,0,0,0.45)'; ctx.shadowBlur=6;
  wrapText(ctx,data.desc,44,178,TW-88,40);
  ctx.shadowBlur=0;

  // нижняя пилюля
  var pillY=TH-140, pillH=112;
  roundRect(ctx,36,pillY,TW-72,pillH,32);

  if(!expanded){
    // пилюля с блюром тоже
    var pb=document.createElement('canvas'); pb.width=TW-72; pb.height=pillH;
    var pc=pb.getContext('2d');
    pc.fillStyle='rgba(255,255,255,0.25)'; pc.fillRect(0,0,TW-72,pillH);
    var pbBlur=blurCanvas(pb,10);
    ctx.save();
    roundRect(ctx,36,pillY,TW-72,pillH,32); ctx.clip();
    ctx.drawImage(pbBlur,36,pillY);
    ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fillRect(36,pillY,TW-72,pillH);
    ctx.restore();
    ctx.strokeStyle='rgba(255,255,255,0.40)'; ctx.lineWidth=1.5;
    roundRect(ctx,36,pillY,TW-72,pillH,32); ctx.stroke();

    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.font='30px -apple-system,BlinkMacSystemFont,Helvetica,sans-serif';
    ctx.textAlign='center';
    ctx.shadowColor='rgba(0,0,0,0.35)'; ctx.shadowBlur=4;
    ctx.fillText(data.duration+'  ·  '+data.price, TW/2, pillY+65);
    ctx.shadowBlur=0;
  } else {
    ctx.save();
    roundRect(ctx,36,pillY,TW-72,pillH,32); ctx.clip();
    ctx.fillStyle='rgba(255,255,255,0.20)'; ctx.fillRect(36,pillY,TW-72,pillH);
    ctx.restore();
    ctx.strokeStyle='rgba(255,255,255,0.40)'; ctx.lineWidth=1.5;
    roundRect(ctx,36,pillY,TW-72,pillH,32); ctx.stroke();

    var iconSize=40, totalW=TW-72, step=totalW/5;
    SOC_ICONS.forEach(function(soc,idx){
      var ix=36+step*idx+step/2-iconSize/2, iy=pillY+(pillH-iconSize)/2;
      if(socImages[idx].complete&&socImages[idx].naturalWidth>0){
        ctx.globalAlpha=0.92;
        drawWhiteIcon(ctx,socImages[idx],ix,iy,iconSize);
        ctx.globalAlpha=1;
      } else {
        ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.beginPath();
        ctx.arc(ix+iconSize/2,iy+iconSize/2,iconSize/2,0,Math.PI*2); ctx.fill();
      }
    });
  }
}

var cardMeshes = [];
CARDS.forEach(function(data, i){
  var angle = (i / CARDS.length) * Math.PI * 2;
  var x = Math.sin(angle) * CARD_RADIUS;
  var z = -Math.cos(angle) * CARD_RADIUS;
  var cc = document.createElement('canvas');
  cc.width=TW; cc.height=TH;
  drawCard(cc, data, false);
  var tex = new THREE.CanvasTexture(cc);
  tex.encoding = THREE.sRGBEncoding;
  var geo = new THREE.PlaneGeometry(CARD_W, CARD_H);
  var mat = new THREE.MeshBasicMaterial({ map:tex, transparent:true, side:THREE.DoubleSide, depthWrite:false });
  var mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, CARD_Y, z);
  mesh.lookAt(0, CARD_Y, 0);
  mainScene.add(mesh);
  cardMeshes.push({ mesh:mesh, angle:angle, tex:tex, cc:cc, data:data });
});

function redrawCard(i){
  drawCard(cardMeshes[i].cc, cardMeshes[i].data, cardExpanded[i]);
  cardMeshes[i].tex.needsUpdate = true;
}
socImages.forEach(function(img){ img.onload = function(){ cardMeshes.forEach(function(_,i){ redrawCard(i); }); }; });

// глубина / прозрачность по дистанции от взгляда
function updateDepth(){
  var dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  cardMeshes.forEach(function(c){
    var cd = new THREE.Vector3(Math.sin(c.angle),0,-Math.cos(c.angle));
    var dot = Math.max(-1,Math.min(1,dir.dot(cd)));
    var t = (dot+1)/2;
    c.mesh.material.opacity = 0.35 + t*0.65;
    c.mesh.scale.setScalar(0.80 + t*0.20);
  });
}

/* ── Raycaster / клик по карточкам ── */
var raycaster = new THREE.Raycaster();
var pointer   = new THREE.Vector2();
var pdx=0, pdy=0;
var skipNextTouch = false; // блокировка после открытия соцсети

canvas.addEventListener('mousedown', function(e){ pdx=e.clientX; pdy=e.clientY; });
canvas.addEventListener('mouseup', function(e){
  if(Math.abs(e.clientX-pdx)>8||Math.abs(e.clientY-pdy)>8) return;
  handleClick(e.clientX, e.clientY, false);
});
canvas.addEventListener('touchstart', function(e){ if(e.touches.length===1){pdx=e.touches[0].clientX;pdy=e.touches[0].clientY;} },{passive:true});
canvas.addEventListener('touchend', function(e){
  if(skipNextTouch){ skipNextTouch=false; return; }
  if(e.changedTouches.length!==1) return;
  var t=e.changedTouches[0];
  if(Math.abs(t.clientX-pdx)>8||Math.abs(t.clientY-pdy)>8) return;
  handleClick(t.clientX, t.clientY, true);
},{passive:true});

function handleClick(cx,cy,isTouch){
  var rect=canvas.getBoundingClientRect();
  pointer.x=((cx-rect.left)/rect.width)*2-1;
  pointer.y=-((cy-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer, camera);
  var hits=raycaster.intersectObjects(cardMeshes.map(function(c){return c.mesh;}));
  if(!hits.length) return;
  var idx=cardMeshes.findIndex(function(c){return c.mesh===hits[0].object;});
  if(idx<0) return;
  var uv=hits[0].uv;
  if(uv&&uv.y<0.20){
    if(cardExpanded[idx]){
      var si=Math.floor(uv.x*5);
      if(isTouch) skipNextTouch=true; // блокируем следующий touchend
      window.open(SOC_ICONS[Math.max(0,Math.min(4,si))].href,'_blank');
    } else { cardExpanded[idx]=true; redrawCard(idx); }
  } else if(cardExpanded[idx]){ cardExpanded[idx]=false; redrawCard(idx); }
}

/* ── Resize ── */
window.addEventListener('resize', function(){
  W=window.innerWidth; H=window.innerHeight;
  camera.aspect = skyCamera.aspect = W/H;
  camera.updateProjectionMatrix();
  skyCamera.updateProjectionMatrix();
  renderer.setSize(W, H);
});

/* ── Controls (из рабочей версии, без изменений) ── */
var qT=new THREE.Quaternion(), qC=new THREE.Quaternion();
var _e=new THREE.Euler(), _q1=new THREE.Quaternion(), _q2=new THREE.Quaternion();
var gyroOn=false, SLERP=0.07;
var dy=0, dp=0.05, dn=false, lx=null, ly=null;
_e.set(dp,dy,0,'YXZ'); qT.setFromEuler(_e);

function screenAngle(){ return (window.screen&&window.screen.orientation)?(window.screen.orientation.angle||0):(window.orientation||0); }
function onOri(e){
  if(e.alpha===null) return; gyroOn=true;
  _e.set(THREE.MathUtils.degToRad(e.beta),THREE.MathUtils.degToRad(e.alpha),-THREE.MathUtils.degToRad(e.gamma),'YXZ');
  qT.setFromEuler(_e);
  _q1.setFromAxisAngle(new THREE.Vector3(1,0,0),-Math.PI/2); qT.multiply(_q1);
  _q2.setFromAxisAngle(new THREE.Vector3(0,0,1),THREE.MathUtils.degToRad(screenAngle())); qT.multiply(_q2);
}
function startGyro(){
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(function(s){if(s==='granted')window.addEventListener('deviceorientation',onOri,true);}).catch(function(){});
  } else { window.addEventListener('deviceorientation',onOri,true); }
}
var permDone=false;
document.addEventListener('touchstart',function(){if(!permDone){permDone=true;startGyro();}},{once:true});
startGyro();

canvas.addEventListener('mousedown',function(e){dn=true;lx=e.clientX;ly=e.clientY;});
window.addEventListener('mouseup',function(){dn=false;});
window.addEventListener('mousemove',function(e){
  if(!dn||gyroOn) return;
  dy-=(e.clientX-lx)*0.003; dp-=(e.clientY-ly)*0.003;
  dp=Math.max(-0.5,Math.min(1.4,dp)); lx=e.clientX; ly=e.clientY;
  _e.set(dp,dy,0,'YXZ'); qT.setFromEuler(_e);
});
var tx=null,ty=null;
canvas.addEventListener('touchstart',function(e){if(!gyroOn){var t=e.touches[0];tx=t.clientX;ty=t.clientY;}},{passive:true});
canvas.addEventListener('touchmove',function(e){
  if(gyroOn) return; var t=e.touches[0];
  if(tx!==null){dy-=(t.clientX-tx)*0.004;dp-=(t.clientY-ty)*0.004;dp=Math.max(-0.5,Math.min(1.4,dp));_e.set(dp,dy,0,'YXZ');qT.setFromEuler(_e);}
  tx=t.clientX; ty=t.clientY;
},{passive:true});

setTimeout(function(){var h=document.getElementById('hint');if(h)h.style.opacity='0';},3500);

/* ── Render loop ── */
var animId=null;
function animate(){
  animId=requestAnimationFrame(animate);
  qC.slerp(qT, SLERP);
  camera.quaternion.copy(qC);
  skyCamera.quaternion.copy(qC);
  updateDepth();
  renderer.clear();
  renderer.render(skyScene, skyCamera);
  renderer.clearDepth();
  renderer.render(mainScene, camera);
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){cancelAnimationFrame(animId);animId=null;}
  else if(!animId) animate();
});
animate();

})();
</script>
</body>
</html>
