<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Paradise Garden</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }
  #gc { display:block; }
  #hint {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    font-size:14px; color:rgba(255,255,255,0.85); pointer-events:none;
    background:rgba(0,0,0,0.3); padding:5px 16px; border-radius:20px;
    transition:opacity 1.2s; font-family:sans-serif;
  }
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="hint">Тяните мышью для поворота</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function(){

/* ═══════════════════════════════════════════════════
   RENDERER & SCENES
═══════════════════════════════════════════════════ */
var canvas = document.getElementById('gc');
var W = window.innerWidth, H = window.innerHeight;

var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.autoClear = false;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

var skyScene  = new THREE.Scene();
var mainScene = new THREE.Scene();
mainScene.fog = new THREE.FogExp2(0x9aaf80, 0.008);

var camera    = new THREE.PerspectiveCamera(75, W/H, 0.1, 500);
var skyCamera = new THREE.PerspectiveCamera(75, W/H, 1, 1000);
camera.position.set(0, 1.6, 0);

/* ═══════════════════════════════════════════════════
   RENDER TARGETS для постпроцессинга
═══════════════════════════════════════════════════ */
var rtParams = {
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  format: THREE.RGBAFormat,
  type: THREE.UnsignedByteType
};

// Основной буфер сцены (без неба)
var rtScene    = new THREE.WebGLRenderTarget(W, H, rtParams);
// Глубина для DoF
var rtDepth    = new THREE.WebGLRenderTarget(W, H, {
  minFilter: THREE.NearestFilter,
  magFilter: THREE.NearestFilter,
  format: THREE.RGBAFormat
});
// Накопительный буфер для motion blur
var rtAccum    = new THREE.WebGLRenderTarget(W, H, rtParams);
var rtPrev     = new THREE.WebGLRenderTarget(W, H, rtParams);
// Финальный буфер DoF
var rtDof      = new THREE.WebGLRenderTarget(W, H, rtParams);

/* ═══════════════════════════════════════════════════
   FULLSCREEN QUAD HELPER
═══════════════════════════════════════════════════ */
function makeQuad(material){
  var geo = new THREE.PlaneGeometry(2, 2);
  var mesh = new THREE.Mesh(geo, material);
  var scene = new THREE.Scene();
  scene.add(mesh);
  var cam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  return { scene:scene, cam:cam, mesh:mesh };
}

/* ═══════════════════════════════════════════════════
   MOTION BLUR — накопительный (blend с предыдущим)
   Формула: accum = current * (1-alpha) + prev * alpha
   alpha ≈ 0.55 → хороший смаз при быстром движении
═══════════════════════════════════════════════════ */
var motionBlurMat = new THREE.ShaderMaterial({
  uniforms: {
    tCurrent: { value: null },
    tPrev:    { value: null },
    uAlpha:   { value: 0.55 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position,1.0); }
  `,
  fragmentShader: `
    uniform sampler2D tCurrent;
    uniform sampler2D tPrev;
    uniform float uAlpha;
    varying vec2 vUv;
    void main(){
      vec4 cur  = texture2D(tCurrent, vUv);
      vec4 prev = texture2D(tPrev,    vUv);
      gl_FragColor = mix(cur, prev, uAlpha);
    }
  `,
  depthTest: false, depthWrite: false
});
var motionBlurQuad = makeQuad(motionBlurMat);

/* ═══════════════════════════════════════════════════
   DEPTH PASS — рисуем глубину в RGBA
   Используем MeshDepthMaterial + pack в цвет
═══════════════════════════════════════════════════ */
// Для глубины используем depthTexture напрямую
rtScene.depthBuffer = true;
rtScene.depthTexture = new THREE.DepthTexture(W, H);
rtScene.depthTexture.format = THREE.DepthFormat;
rtScene.depthTexture.type   = THREE.UnsignedShortType;

/* ═══════════════════════════════════════════════════
   DOF PASS — размываем по глубине
   Небо не затрагиваем (depth == 1.0 → пропускаем)
═══════════════════════════════════════════════════ */
var dofMat = new THREE.ShaderMaterial({
  uniforms: {
    tColor:    { value: null },
    tDepth:    { value: null },
    uNear:     { value: camera.near },
    uFar:      { value: camera.far },
    uFocus:    { value: 0.015 },  // фокус — примерно 8м от камеры
    uAperture: { value: 6.0  },   // сила блюра
    uRes:      { value: new THREE.Vector2(W, H) }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position,1.0); }
  `,
  fragmentShader: `
    uniform sampler2D tColor;
    uniform sampler2D tDepth;
    uniform float uNear, uFar, uFocus, uAperture;
    uniform vec2 uRes;
    varying vec2 vUv;

    float linearDepth(float d){
      float z = d * 2.0 - 1.0;
      return (2.0 * uNear * uFar) / (uFar + uNear - z*(uFar - uNear));
    }

    // 13-tap gaussian blur
    vec4 blur(sampler2D tex, vec2 uv, vec2 dir){
      vec4 c = vec4(0.0);
      float w[7]; w[0]=0.0625; w[1]=0.125; w[2]=0.1875; w[3]=0.25; w[4]=0.1875; w[5]=0.125; w[6]=0.0625;
      for(int i=0;i<7;i++){
        vec2 off = dir * (float(i)-3.0);
        c += texture2D(tex, uv + off) * w[i];
      }
      return c;
    }

    void main(){
      float rawD  = texture2D(tDepth, vUv).r;

      // Небо (depth ~= 1.0) — не размываем
      if(rawD > 0.9999){
        gl_FragColor = texture2D(tColor, vUv);
        return;
      }

      float depth  = linearDepth(rawD);
      float coc    = abs(depth * uFocus - 1.0) * uAperture; // circle of confusion
      coc = clamp(coc, 0.0, 1.0);

      // Размер блюра в пикселях (макс 12px)
      float blurPx = coc * 12.0;
      vec2 px      = vec2(blurPx) / uRes;

      // Два прохода — горизонталь + вертикаль (separable)
      vec4 h = blur(tColor, vUv, vec2(px.x, 0.0));
      // Для вертикали сэмплируем из горизонтального результата
      // (приближение — одиночный проход через оба направления)
      vec4 sharp  = texture2D(tColor, vUv);
      vec4 blured = (blur(tColor, vUv, vec2(px.x,0.)) + blur(tColor, vUv, vec2(0.,px.y))) * 0.5;

      gl_FragColor = mix(sharp, blured, coc);
    }
  `,
  depthTest: false, depthWrite: false
});
var dofQuad = makeQuad(dofMat);

/* ═══════════════════════════════════════════════════
   FINAL COMPOSITE — выводим на экран
═══════════════════════════════════════════════════ */
var finalMat = new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: null } },
  vertexShader:   `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tDiffuse,vUv); }`,
  depthTest: false, depthWrite: false
});
var finalQuad = makeQuad(finalMat);

/* ═══════════════════════════════════════════════════
   SKY
═══════════════════════════════════════════════════ */
var skyGeo = new THREE.SphereGeometry(500, 64, 32);
skyGeo.scale(-1, 1, 1);
var skyMat = new THREE.ShaderMaterial({
  uniforms:{top:{value:new THREE.Color(0x2a6fbe)},bot:{value:new THREE.Color(0xb0cfe8)}},
  vertexShader:`varying vec3 vP; void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform vec3 top,bot; varying vec3 vP; void main(){float h=clamp(normalize(vP).y*2.,0.,1.);gl_FragColor=vec4(mix(bot,top,h),1.);}`
});
var skyMesh = new THREE.Mesh(skyGeo, skyMat);
skyScene.add(skyMesh);

var patch = new THREE.Mesh(
  new THREE.CircleGeometry(499,64),
  new THREE.MeshBasicMaterial({color:0x7a8c55})
);
patch.rotation.x=-Math.PI/2; patch.position.y=-30;
skyScene.add(patch);

var loader = new THREE.TextureLoader();
loader.crossOrigin = 'anonymous';
var BASE = 'https://cdn.jsdelivr.net/gh/CakeBoxDeveloper/massage@main/';

loader.load(BASE+'Sky.webp', function(tex){
  tex.encoding = THREE.sRGBEncoding;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.offset.set(0.5,-0.02);
  skyMesh.material = new THREE.MeshBasicMaterial({map:tex});
});

/* ═══════════════════════════════════════════════════
   GROUND
═══════════════════════════════════════════════════ */
var REPEAT = 18;
var groundMat = new THREE.MeshStandardMaterial({color:0x6a9a4a, roughness:0.85, metalness:0.0});
var ground = new THREE.Mesh(new THREE.PlaneGeometry(200,200,128,128), groundMat);
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true;
mainScene.add(ground);

function applyTex(tex,r){
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(r,r); return tex;
}
loader.load(BASE+'Lite2forest_floor_albedo.webp', function(tex){
  tex.encoding=THREE.sRGBEncoding;
  groundMat.map=applyTex(tex,REPEAT); groundMat.color.set(0xffffff); groundMat.needsUpdate=true;
});
loader.load(BASE+'Lite2forest_floor_Normal-ogl.webp', function(tex){
  groundMat.normalMap=applyTex(tex,REPEAT); groundMat.normalScale.set(1.2,1.2); groundMat.needsUpdate=true;
});

/* ═══════════════════════════════════════════════════
   LIGHTS
═══════════════════════════════════════════════════ */
mainScene.add(new THREE.AmbientLight(0xfff0d0, 0.6));
var sun = new THREE.DirectionalLight(0xffeebb, 1.4);
sun.position.set(60,80,-40); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.near=1; sun.shadow.camera.far=300;
sun.shadow.camera.left=sun.shadow.camera.bottom=-80;
sun.shadow.camera.right=sun.shadow.camera.top=80;
mainScene.add(sun);

/* ═══════════════════════════════════════════════════
   BUSHES — billboard
═══════════════════════════════════════════════════ */
var bushNames=['Bush1.webp','Bush2.webp','Bush3.webp'];
var bushMats=[], bushMeshes=[], bushesReady=0;

function spawnBushes(){
  var rng=mulberry32(42), COUNT=120;
  for(var i=0;i<COUNT;i++){
    var ti=Math.floor(rng()*3), mat=bushMats[ti];
    var angle=rng()*Math.PI*2, dist=3+rng()*57;
    var x=Math.cos(angle)*dist, z=Math.sin(angle)*dist;
    var w=1.2+rng()*2.0, h=w*(0.7+rng()*0.5);
    var mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h), mat);
    mesh.position.set(x, h*0.5-0.05, z);
    mainScene.add(mesh);
    bushMeshes.push(mesh);
  }
}

bushNames.forEach(function(name,idx){
  loader.load(BASE+name, function(tex){
    tex.encoding=THREE.sRGBEncoding;
    bushMats[idx]=new THREE.MeshStandardMaterial({
      map:tex, alphaTest:0.4, transparent:false,
      side:THREE.DoubleSide, roughness:0.9, metalness:0.0
    });
    if(++bushesReady===3) spawnBushes();
  });
});

function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  }
}

/* ═══════════════════════════════════════════════════
   RESIZE
═══════════════════════════════════════════════════ */
window.addEventListener('resize', function(){
  W=window.innerWidth; H=window.innerHeight;
  camera.aspect=skyCamera.aspect=W/H;
  camera.updateProjectionMatrix(); skyCamera.updateProjectionMatrix();
  renderer.setSize(W,H);
  rtScene.setSize(W,H); rtAccum.setSize(W,H);
  rtPrev.setSize(W,H);  rtDof.setSize(W,H);
  dofMat.uniforms.uRes.value.set(W,H);
});

/* ═══════════════════════════════════════════════════
   CONTROLS
═══════════════════════════════════════════════════ */
var qT=new THREE.Quaternion(), qC=new THREE.Quaternion();
var _e=new THREE.Euler(), _q1=new THREE.Quaternion(), _q2=new THREE.Quaternion();
var gyroOn=false, SLERP=0.07;
var dy=0, dp=0.05, dn=false, lx=null, ly=null;
_e.set(dp,dy,0,'YXZ'); qT.setFromEuler(_e);

// Угловая скорость для motion blur alpha
var prevQuat = new THREE.Quaternion();
var angularSpeed = 0;

function screenAngle(){ return (window.screen&&window.screen.orientation)?(window.screen.orientation.angle||0):(window.orientation||0); }
function onOri(e){
  if(e.alpha===null) return; gyroOn=true;
  _e.set(THREE.MathUtils.degToRad(e.beta),THREE.MathUtils.degToRad(e.alpha),-THREE.MathUtils.degToRad(e.gamma),'YXZ');
  qT.setFromEuler(_e);
  _q1.setFromAxisAngle(new THREE.Vector3(1,0,0),-Math.PI/2); qT.multiply(_q1);
  _q2.setFromAxisAngle(new THREE.Vector3(0,0,1),THREE.MathUtils.degToRad(screenAngle())); qT.multiply(_q2);
}
function startGyro(){
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(function(s){ if(s==='granted') window.addEventListener('deviceorientation',onOri,true); }).catch(function(){});
  } else { window.addEventListener('deviceorientation',onOri,true); }
}
var permDone=false;
document.addEventListener('touchstart',function(){ if(!permDone){permDone=true;startGyro();} },{once:true});
startGyro();

canvas.addEventListener('mousedown',function(e){dn=true;lx=e.clientX;ly=e.clientY;});
window.addEventListener('mouseup',function(){dn=false;});
window.addEventListener('mousemove',function(e){
  if(!dn||gyroOn) return;
  dy-=(e.clientX-lx)*0.003; dp-=(e.clientY-ly)*0.003;
  dp=Math.max(-0.5,Math.min(1.4,dp)); lx=e.clientX; ly=e.clientY;
  _e.set(dp,dy,0,'YXZ'); qT.setFromEuler(_e);
});
var tx=null,ty=null;
canvas.addEventListener('touchstart',function(e){if(!gyroOn){var t=e.touches[0];tx=t.clientX;ty=t.clientY;}},{passive:true});
canvas.addEventListener('touchmove',function(e){
  if(gyroOn) return; var t=e.touches[0];
  if(tx!==null){dy-=(t.clientX-tx)*0.004;dp-=(t.clientY-ty)*0.004;dp=Math.max(-0.5,Math.min(1.4,dp));_e.set(dp,dy,0,'YXZ');qT.setFromEuler(_e);}
  tx=t.clientX; ty=t.clientY;
},{passive:true});

setTimeout(function(){var h=document.getElementById('hint');if(h)h.style.opacity='0';},3500);

/* ═══════════════════════════════════════════════════
   RENDER LOOP
═══════════════════════════════════════════════════ */
var _bt=new THREE.Vector3();
var accumInit=false;
var animId=null;

function animate(){
  animId=requestAnimationFrame(animate);

  // Обновляем камеру
  prevQuat.copy(qC);
  qC.slerp(qT, SLERP);
  camera.quaternion.copy(qC);
  skyCamera.quaternion.copy(qC);

  // Угловая скорость → сила motion blur
  var dot = Math.abs(prevQuat.dot(qC));
  dot = Math.min(dot, 1.0);
  angularSpeed = Math.acos(dot) * 2.0; // радианы за кадр
  // Нормируем: 0 = нет движения, 1 = максимум
  var blurStrength = Math.min(angularSpeed * 18.0, 0.85);
  motionBlurMat.uniforms.uAlpha.value = blurStrength;

  // Billboard кусты
  for(var i=0;i<bushMeshes.length;i++){
    var m=bushMeshes[i];
    _bt.set(camera.position.x, m.position.y, camera.position.z);
    m.lookAt(_bt);
  }

  /* ── 1. Рендер неба прямо на экран ── */
  renderer.setRenderTarget(null);
  renderer.clear();
  renderer.render(skyScene, skyCamera);

  /* ── 2. Рендер основной сцены в rtScene (с depth texture) ── */
  renderer.setRenderTarget(rtScene);
  renderer.clear();
  renderer.render(mainScene, camera);

  /* ── 3. Motion blur: смешать rtScene с rtPrev → rtAccum ── */
  if(!accumInit){
    // Первый кадр — копируем как есть
    renderer.setRenderTarget(rtAccum);
    renderer.clear();
    finalMat.uniforms.tDiffuse.value = rtScene.texture;
    renderer.render(finalQuad.scene, finalQuad.cam);
    accumInit=true;
  } else {
    motionBlurMat.uniforms.tCurrent.value = rtScene.texture;
    motionBlurMat.uniforms.tPrev.value    = rtPrev.texture;
    renderer.setRenderTarget(rtAccum);
    renderer.clear();
    renderer.render(motionBlurQuad.scene, motionBlurQuad.cam);
  }

  // Копируем rtAccum → rtPrev для следующего кадра
  renderer.setRenderTarget(rtPrev);
  renderer.clear();
  finalMat.uniforms.tDiffuse.value = rtAccum.texture;
  renderer.render(finalQuad.scene, finalQuad.cam);

  /* ── 4. DoF: размываем rtAccum по depth → rtDof ── */
  dofMat.uniforms.tColor.value = rtAccum.texture;
  dofMat.uniforms.tDepth.value = rtScene.depthTexture;
  dofMat.uniforms.uNear.value  = camera.near;
  dofMat.uniforms.uFar.value   = camera.far;
  renderer.setRenderTarget(rtDof);
  renderer.clear();
  renderer.render(dofQuad.scene, dofQuad.cam);

  /* ── 5. Composite: вывод rtDof поверх неба ── */
  renderer.setRenderTarget(null);
  renderer.clearDepth();
  finalMat.uniforms.tDiffuse.value = rtDof.texture;
  renderer.render(finalQuad.scene, finalQuad.cam);
}

document.addEventListener('visibilitychange',function(){
  if(document.hidden){cancelAnimationFrame(animId);animId=null;}
  else if(!animId) animate();
});
animate();

})();
</script>
</body>
</html>
