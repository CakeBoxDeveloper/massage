<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Час для себе — Студія масажу</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; touch-action:none; user-select:none; -webkit-user-select:none; }
  #gc { position:fixed; inset:0; width:100%; height:100%; }
  #hint {
    position:fixed; bottom:32px; left:50%; transform:translateX(-50%);
    z-index:20; font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:0.68rem; color:rgba(255,255,255,0.40); letter-spacing:1.2px;
    text-transform:uppercase; text-align:center; pointer-events:none;
    transition:opacity 1.2s ease; white-space:nowrap;
  }
  #hint.hidden { opacity:0; }
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="hint">Крутіть телефон навколо себе</div>
<script>
(function(){

// ── Данные ──
const CARDS = [
  { name:'Класичний масаж',    desc:'Відновлює кровообіг, знімає м\'язову напругу та покращує загальний тонус тіла. Ідеально після важкого тижня.',        duration:'60 або 90 хв', price:'600 / 850 грн'  },
  { name:'Глибокий тканинний', desc:'Інтенсивний вплив на глибокі шари м\'язів. Ефективний при хронічних болях та м\'язових затисках після стресу.',       duration:'60 або 90 хв', price:'750 / 1050 грн' },
  { name:'Аромамасаж',         desc:'М\'які техніки з натуральними ефірними оліями. Заспокоює нервову систему та наповнює тіло відчуттям легкості.',        duration:'75 або 90 хв', price:'700 / 900 грн'  },
  { name:'Масаж спини та шиї', desc:'Знімає головний біль, напругу від сидячої роботи та скутість у плечовому поясі. Результат після першого сеансу.',      duration:'30 або 45 хв', price:'400 / 550 грн'  },
  { name:'Антицелюлітний',     desc:'Лімфодренаж та покращення мікроциркуляції. Шкіра стає пружнішою, контури — чіткішими. Курс від 8 сеансів.',            duration:'45 або 60 хв', price:'650 / 850 грн'  },
  { name:'Спортивний масаж',   desc:'Відновлення після тренувань, профілактика травм, підвищення гнучкості та тонусу м\'язів. До і після навантажень.',      duration:'60 хв',        price:'700 грн'        },
];

const SOC_ICONS = [
  { href:'https://threads.net/',           src:'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/hreads.svg',   alt:'Threads'   },
  { href:'https://t.me/username',          src:'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/telegram.svg', alt:'Telegram'  },
  { href:'https://instagram.com/username', src:'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/insta.svg',    alt:'Instagram' },
  { href:'https://wa.me/380000000000',     src:'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/wa.svg',       alt:'WhatsApp'  },
  { href:'tel:+380000000000',              src:'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/call.svg',     alt:'Дзвінок'   },
];

// ── Renderer ──
const canvas   = document.getElementById('gc');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);

// ── HDRI-сфера ──
const skyGeo = new THREE.SphereGeometry(500, 64, 32);
skyGeo.scale(-1, 1, 1);
const skyMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
const skyMesh = new THREE.Mesh(skyGeo, skyMat);
scene.add(skyMesh);

const loader = new THREE.TextureLoader();
loader.crossOrigin = 'anonymous';
loader.load(
  'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/main/%7B__prompt____An_equirectangular_360-degree_202606110114.jpeg',
  function(tex){
    tex.encoding = THREE.sRGBEncoding;
    skyMesh.material = new THREE.MeshBasicMaterial({ map: tex });
  }
);

// ── Canvas-карточки ──
const RADIUS = 4.5;
const CARD_W = 2.0, CARD_H = 2.9;
const TW = 520, TH = 740;
const cardExpanded = new Array(CARDS.length).fill(false);

const socImages = SOC_ICONS.map(s => {
  const img = new Image(); img.crossOrigin = 'anonymous'; img.src = s.src; return img;
});

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function wrapText(ctx,text,x,y,maxW,lineH){
  const words=text.split(' '); let line='';
  for(let i=0;i<words.length;i++){
    const test=line+words[i]+' ';
    if(ctx.measureText(test).width>maxW&&i>0){ ctx.fillText(line.trim(),x,y); line=words[i]+' '; y+=lineH; }
    else line=test;
  }
  ctx.fillText(line.trim(),x,y);
}

function drawCard(cardCanvas, data, expanded){
  const ctx = cardCanvas.getContext('2d');
  ctx.clearRect(0,0,TW,TH);
  const bg = ctx.createLinearGradient(0,0,0,TH);
  bg.addColorStop(0,'rgba(200,210,230,0.18)'); bg.addColorStop(1,'rgba(160,180,210,0.08)');
  ctx.fillStyle=bg; roundRect(ctx,0,0,TW,TH,56); ctx.fill();
  const shine=ctx.createLinearGradient(0,0,0,TH*0.4);
  shine.addColorStop(0,'rgba(255,255,255,0.12)'); shine.addColorStop(1,'rgba(255,255,255,0.00)');
  ctx.fillStyle=shine; roundRect(ctx,0,0,TW,TH,56); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.60)'; ctx.lineWidth=2.5;
  roundRect(ctx,1.5,1.5,TW-3,TH-3,55); ctx.stroke();
  ctx.fillStyle='#ffffff';
  ctx.font='bold 44px -apple-system,BlinkMacSystemFont,Helvetica,sans-serif';
  ctx.textAlign='left';
  wrapText(ctx,data.name,44,82,TW-88,54);
  ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(44,120); ctx.lineTo(TW-44,120); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.80)';
  ctx.font='29px -apple-system,BlinkMacSystemFont,Helvetica,sans-serif';
  wrapText(ctx,data.desc,44,168,TW-88,40);
  const pillY=TH-148, pillH=108;
  roundRect(ctx,36,pillY,TW-72,pillH,28);
  if(!expanded){
    const pillBg=ctx.createLinearGradient(0,pillY,0,pillY+pillH);
    pillBg.addColorStop(0,'rgba(255,255,255,0.12)'); pillBg.addColorStop(1,'rgba(255,255,255,0.06)');
    ctx.fillStyle=pillBg; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.90)';
    ctx.font='31px -apple-system,BlinkMacSystemFont,Helvetica,sans-serif';
    ctx.textAlign='center';
    ctx.fillText(data.duration+'  ·  '+data.price, TW/2, pillY+64);
    ctx.fillStyle='rgba(255,255,255,0.30)';
    ctx.font='22px -apple-system,sans-serif';
    ctx.fillText('Натисни для запису', TW/2, TH-22);
  } else {
    const pillBg=ctx.createLinearGradient(0,pillY,0,pillY+pillH);
    pillBg.addColorStop(0,'rgba(255,255,255,0.16)'); pillBg.addColorStop(1,'rgba(255,255,255,0.08)');
    ctx.fillStyle=pillBg; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1.5; ctx.stroke();
    const iconSize=38, totalW=TW-72, step=totalW/5;
    SOC_ICONS.forEach((soc,idx)=>{
      const ix=36+step*idx+step/2-iconSize/2, iy=pillY+(pillH-iconSize)/2;
      if(socImages[idx].complete&&socImages[idx].naturalWidth>0){
        ctx.globalAlpha=0.85; ctx.drawImage(socImages[idx],ix,iy,iconSize,iconSize); ctx.globalAlpha=1;
      } else {
        ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.beginPath();
        ctx.arc(ix+iconSize/2,iy+iconSize/2,iconSize/2,0,Math.PI*2); ctx.fill();
      }
    });
  }
}

const cardMeshes = [];
CARDS.forEach((data, i) => {
  const angle = (i / CARDS.length) * Math.PI * 2;
  const x = Math.sin(angle) * RADIUS;
  const z = -Math.cos(angle) * RADIUS;
  const cardCanvas = document.createElement('canvas');
  cardCanvas.width=TW; cardCanvas.height=TH;
  drawCard(cardCanvas, data, false);
  const tex = new THREE.CanvasTexture(cardCanvas);
  tex.encoding = THREE.sRGBEncoding;
  const geo = new THREE.PlaneGeometry(CARD_W, CARD_H);
  const mat = new THREE.MeshBasicMaterial({ map:tex, transparent:true, side:THREE.DoubleSide, depthWrite:false });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, 0, z);
  mesh.lookAt(0, 0, 0);
  scene.add(mesh);
  cardMeshes.push({ mesh, angle, tex, cardCanvas, data, index:i });
});

function redrawCard(i){
  const {cardCanvas,tex,data}=cardMeshes[i];
  drawCard(cardCanvas,data,cardExpanded[i]);
  tex.needsUpdate=true;
}
socImages.forEach(img=>{ img.onload=()=>{ cardMeshes.forEach((_,i)=>redrawCard(i)); }; });

// ── Raycaster ──
const raycaster = new THREE.Raycaster();
const pointer   = new THREE.Vector2();

// Відстежуємо рух між pointerdown і pointerup щоб не спрацьовував клік під час перетягування
let pointerDownX = 0, pointerDownY = 0;
const DRAG_THRESHOLD = 8; // px

canvas.addEventListener('pointerdown', e => {
  pointerDownX = e.clientX;
  pointerDownY = e.clientY;
});

function onPointerUp(e){
  const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
  const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;

  // Якщо це був drag — не обробляємо як клік
  const dx = clientX - pointerDownX;
  const dy = clientY - pointerDownY;
  if(Math.sqrt(dx*dx + dy*dy) > DRAG_THRESHOLD) return;

  const rect = canvas.getBoundingClientRect();
  pointer.x = ((clientX - rect.left) / rect.width)  *  2 - 1;
  pointer.y = -((clientY - rect.top)  / rect.height) *  2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(cardMeshes.map(c => c.mesh));
  if(!hits.length) return;
  const hit = hits[0];
  const idx = cardMeshes.findIndex(c => c.mesh === hit.object);
  if(idx < 0) return;
  const uv = hit.uv;
  if(uv && uv.y < 0.22){
    if(cardExpanded[idx]){
      const socIdx = Math.floor(uv.x * 5);
      window.open(SOC_ICONS[Math.max(0, Math.min(4, socIdx))].href, '_blank');
    } else { cardExpanded[idx] = true; redrawCard(idx); }
  } else if(cardExpanded[idx]){ cardExpanded[idx] = false; redrawCard(idx); }
}
canvas.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('touchend',  onPointerUp, {passive:true});

// ── Глибина ──
function updateDepth(){
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  cardMeshes.forEach(({mesh, angle}) => {
    const cd  = new THREE.Vector3(Math.sin(angle), 0, -Math.cos(angle));
    const dot = Math.max(-1, Math.min(1, dir.dot(cd)));
    const t   = (dot + 1) / 2;
    mesh.material.opacity = 0.4 + t * 0.6;
    mesh.scale.setScalar(0.82 + t * 0.18);
  });
}

// ── Стан камери (єдиний euler, без qTarget/qCurrent конфлікту) ──
const camEuler = new THREE.Euler(0, 0, 0, 'YXZ');

// ── Гіроскоп ──
let gyroActive     = false;
let gyroCalibrated = false;
let gyroYawOffset  = 0;
// Для плавного slerp тільки на гіроскопі
const qGyroTarget  = new THREE.Quaternion();
const qGyroCurrent = new THREE.Quaternion();
let   useGyroSlerp = false;

function onDeviceOrientation(e){
  if(e.alpha == null || e.beta == null || e.gamma == null) return;
  gyroActive = true;
  useGyroSlerp = true;
  const toR = Math.PI / 180;
  const qZ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),  e.alpha * toR);
  const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),  e.beta  * toR);
  const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), -e.gamma * toR);
  const qDev = new THREE.Quaternion().multiply(qZ).multiply(qX).multiply(qY);
  qDev.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), -Math.PI / 2));
  const eu = new THREE.Euler().setFromQuaternion(qDev, 'YXZ');
  eu.z = 0;
  eu.x = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, eu.x));
  if(!gyroCalibrated){ gyroYawOffset = eu.y; gyroCalibrated = true; }
  eu.y -= gyroYawOffset;
  qGyroTarget.setFromEuler(eu);
}

// Подвійний тап / подвійний клік — рекалібрація гіроскопу
document.addEventListener('dblclick', () => { gyroCalibrated = false; });
let lastTap = 0;
document.addEventListener('touchend', () => {
  const n = Date.now();
  if(n - lastTap < 300) gyroCalibrated = false;
  lastTap = n;
}, {passive:true});

function startGyro(){
  if(typeof DeviceOrientationEvent !== 'undefined' &&
     typeof DeviceOrientationEvent.requestPermission === 'function'){
    DeviceOrientationEvent.requestPermission()
      .then(r => { if(r === 'granted') window.addEventListener('deviceorientation', onDeviceOrientation, true); })
      .catch(() => {});
  } else {
    window.addEventListener('deviceorientation', onDeviceOrientation, true);
  }
}
if(/iPhone|iPad|iPod/i.test(navigator.userAgent)){
  document.addEventListener('touchstart', function ask(){ startGyro(); document.removeEventListener('touchstart', ask); }, {once:true});
} else {
  startGyro();
}

// ── Миша: пряме керування з інерцією ──
// Немає qTarget — миша пише напряму в camEuler через швидкість
let   mouseDown  = false;
let   lastMX = 0, lastMY = 0;
let   velYaw = 0, velPitch = 0;          // поточна кутова швидкість (рад/кадр)
const MOUSE_SENS   = 0.0030;
const INERTIA      = 0.88;               // коефіцієнт затухання (0..1)
const VEL_DEADZONE = 0.00005;            // нижче — обнуляємо

document.addEventListener('mousedown', e => {
  if(e.button !== 0) return;
  mouseDown = true;
  velYaw = velPitch = 0;                 // зупиняємо інерцію при захопленні
  lastMX = e.clientX;
  lastMY = e.clientY;
});
document.addEventListener('mouseup', () => { mouseDown = false; });
document.addEventListener('mousemove', e => {
  if(!mouseDown || gyroActive) return;
  const dx = e.clientX - lastMX;
  const dy = e.clientY - lastMY;
  velYaw   = -dx * MOUSE_SENS;
  velPitch = -dy * MOUSE_SENS * 0.7;
  lastMX = e.clientX;
  lastMY = e.clientY;
});

// ── Touch-свайп (мобільний, без гіроскопу) ──
let touchStartX = 0, touchStartY = 0;
let lastTouchX  = 0, lastTouchY  = 0;
let touchActive = false;
const TOUCH_SENS = 0.0025;

canvas.addEventListener('touchstart', e => {
  if(gyroActive) return;
  if(e.touches.length !== 1) return;
  touchActive = true;
  velYaw = velPitch = 0;
  touchStartX = lastTouchX = e.touches[0].clientX;
  touchStartY = lastTouchY = e.touches[0].clientY;
  pointerDownX = touchStartX;
  pointerDownY = touchStartY;
}, {passive:true});

canvas.addEventListener('touchmove', e => {
  if(!touchActive || gyroActive) return;
  if(e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - lastTouchX;
  const dy = e.touches[0].clientY - lastTouchY;
  velYaw   = -dx * TOUCH_SENS;
  velPitch = -dy * TOUCH_SENS * 0.7;
  lastTouchX = e.touches[0].clientX;
  lastTouchY = e.touches[0].clientY;
}, {passive:true});

canvas.addEventListener('touchend', () => { touchActive = false; }, {passive:true});

// ── Resize ──
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

setTimeout(() => { document.getElementById('hint').classList.add('hidden'); }, 4000);

// ── Анімація ──
(function animate(){
  requestAnimationFrame(animate);

  if(useGyroSlerp){
    // Гіроскоп: плавний slerp до цілі
    qGyroCurrent.slerp(qGyroTarget, 0.08);
    camera.quaternion.copy(qGyroCurrent);
  } else {
    // Миша / свайп: інерція через euler
    if(Math.abs(velYaw)   > VEL_DEADZONE || Math.abs(velPitch) > VEL_DEADZONE){
      camEuler.y += velYaw;
      camEuler.x += velPitch;
      camEuler.x  = Math.max(-0.65, Math.min(0.65, camEuler.x));
      velYaw   *= INERTIA;
      velPitch *= INERTIA;
      if(Math.abs(velYaw)   < VEL_DEADZONE) velYaw   = 0;
      if(Math.abs(velPitch) < VEL_DEADZONE) velPitch = 0;
    }
    camera.quaternion.setFromEuler(camEuler);
  }

  updateDepth();
  renderer.render(scene, camera);
})();

})();
</script>
</body>
</html>
