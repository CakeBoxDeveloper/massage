<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Час для себе — Студія масажу</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        #three-canvas {
            position: fixed;
            inset: 0;
            width: 100%; height: 100%;
        }

        /* Подсказка */
        #hint {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 0.68rem;
            color: rgba(255,255,255,0.40);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            text-align: center;
            pointer-events: none;
            transition: opacity 1.2s ease;
            white-space: nowrap;
        }
        #hint.hidden { opacity: 0; }
    </style>
</head>
<body>

<canvas id="three-canvas"></canvas>
<div id="hint">Крутіть телефон навколо себе</div>

<script>
// ═══════════════════════════════════════
// ДАННЫЕ
// ═══════════════════════════════════════
const CARDS = [
    { name: 'Класичний масаж',    desc: 'Відновлює кровообіг, знімає м\'язову напругу та покращує загальний тонус тіла. Ідеально після важкого тижня.',         duration: '60 або 90 хв', price: '600 / 850 грн'  },
    { name: 'Глибокий тканинний', desc: 'Інтенсивний вплив на глибокі шари м\'язів. Ефективний при хронічних болях та м\'язових затисках після стресу.',        duration: '60 або 90 хв', price: '750 / 1050 грн' },
    { name: 'Аромамасаж',         desc: 'М\'які техніки з натуральними ефірними оліями. Заспокоює нервову систему та наповнює тіло відчуттям легкості.',         duration: '75 або 90 хв', price: '700 / 900 грн'  },
    { name: 'Масаж спини та шиї', desc: 'Знімає головний біль, напругу від сидячої роботи та скутість у плечовому поясі. Результат після першого сеансу.',       duration: '30 або 45 хв', price: '400 / 550 грн'  },
    { name: 'Антицелюлітний',     desc: 'Лімфодренаж та покращення мікроциркуляції. Шкіра стає пружнішою, контури — чіткішими. Курс від 8 сеансів.',             duration: '45 або 60 хв', price: '650 / 850 грн'  },
    { name: 'Спортивний масаж',   desc: 'Відновлення після тренувань, профілактика травм, підвищення гнучкості та тонусу м\'язів. До і після навантажень.',       duration: '60 хв',        price: '700 грн'        },
];

const SOC_ICONS = [
    { href: 'https://threads.net/',          src: 'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/hreads.svg',   alt: 'Threads'   },
    { href: 'https://t.me/username',         src: 'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/telegram.svg', alt: 'Telegram'  },
    { href: 'https://instagram.com/username',src: 'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/insta.svg',    alt: 'Instagram' },
    { href: 'https://wa.me/380000000000',    src: 'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/wa.svg',       alt: 'WhatsApp'  },
    { href: 'tel:+380000000000',             src: 'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/call.svg',     alt: 'Дзвінок'   },
];

// ═══════════════════════════════════════
// THREE SETUP
// ═══════════════════════════════════════
const canvas   = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);

// Видео-сфера
const video = document.createElement('video');
video.src         = 'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/main/SpaceSeamless.mp4';
video.crossOrigin = 'anonymous';
video.loop = true; video.muted = true; video.playsInline = true; video.autoplay = true;
video.play().catch(() => {});
const videoTex = new THREE.VideoTexture(video);
videoTex.colorSpace = THREE.SRGBColorSpace;
const skyGeo = new THREE.SphereGeometry(80, 64, 32);
skyGeo.scale(-1, 1, 1);
scene.add(new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ map: videoTex })));

// ═══════════════════════════════════════
// КАРТОЧКИ — Canvas Texture
// ═══════════════════════════════════════
const RADIUS = 4.5;
const CARD_W = 2.0;
const CARD_H = 2.9;
const TW = 520, TH = 740;

// Состояние раскрытых карточек (какая показывает иконки)
const cardExpanded = new Array(CARDS.length).fill(false);

// Иконки (Image объекты) грузим заранее
const socImages = SOC_ICONS.map(s => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = s.src;
    return img;
});

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

function wrapText(ctx, text, x, y, maxW, lineH) {
    const words = text.split(' ');
    let line = '';
    for (let i = 0; i < words.length; i++) {
        const test = line + words[i] + ' ';
        if (ctx.measureText(test).width > maxW && i > 0) {
            ctx.fillText(line.trim(), x, y);
            line = words[i] + ' ';
            y += lineH;
        } else { line = test; }
    }
    ctx.fillText(line.trim(), x, y);
}

function drawCard(cardCanvas, data, expanded) {
    const ctx = cardCanvas.getContext('2d');
    ctx.clearRect(0, 0, TW, TH);

    // Фон — тёмное стекло с лёгким blur-эффектом через полупрозрачность
    const bg = ctx.createLinearGradient(0, 0, 0, TH);
    bg.addColorStop(0, 'rgba(200,210,230,0.18)');
    bg.addColorStop(1, 'rgba(160,180,210,0.08)');
    ctx.fillStyle = bg;
    roundRect(ctx, 0, 0, TW, TH, 56);
    ctx.fill();

    // Внутренний блик сверху
    const shine = ctx.createLinearGradient(0, 0, 0, TH * 0.4);
    shine.addColorStop(0, 'rgba(255,255,255,0.12)');
    shine.addColorStop(1, 'rgba(255,255,255,0.00)');
    ctx.fillStyle = shine;
    roundRect(ctx, 0, 0, TW, TH, 56);
    ctx.fill();

    // Контур
    ctx.strokeStyle = 'rgba(255,255,255,0.60)';
    ctx.lineWidth = 2.5;
    roundRect(ctx, 1.5, 1.5, TW-3, TH-3, 55);
    ctx.stroke();

    // Название
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 44px -apple-system, BlinkMacSystemFont, Helvetica, sans-serif';
    ctx.textAlign = 'left';
    wrapText(ctx, data.name, 44, 82, TW - 88, 54);

    // Разделитель
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(44, 120); ctx.lineTo(TW-44, 120); ctx.stroke();

    // Описание
    ctx.fillStyle = 'rgba(255,255,255,0.80)';
    ctx.font = '29px -apple-system, BlinkMacSystemFont, Helvetica, sans-serif';
    wrapText(ctx, data.desc, 44, 168, TW - 88, 40);

    // ── Нижняя плашка ──
    const pillY = TH - 148;
    const pillH = 108;

    roundRect(ctx, 36, pillY, TW - 72, pillH, 28);

    if (!expanded) {
        // Обычное состояние — длительность · цена
        const pillBg = ctx.createLinearGradient(0, pillY, 0, pillY + pillH);
        pillBg.addColorStop(0, 'rgba(255,255,255,0.12)');
        pillBg.addColorStop(1, 'rgba(255,255,255,0.06)');
        ctx.fillStyle = pillBg;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.28)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.90)';
        ctx.font = '31px -apple-system, BlinkMacSystemFont, Helvetica, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(data.duration + '  ·  ' + data.price, TW / 2, pillY + 64);
    } else {
        // Раскрытое состояние — 5 иконок
        const pillBg = ctx.createLinearGradient(0, pillY, 0, pillY + pillH);
        pillBg.addColorStop(0, 'rgba(255,255,255,0.16)');
        pillBg.addColorStop(1, 'rgba(255,255,255,0.08)');
        ctx.fillStyle = pillBg;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 5 иконок равномерно
        const iconSize = 38;
        const totalW   = TW - 72;
        const step     = totalW / 5;
        SOC_ICONS.forEach((soc, idx) => {
            const ix = 36 + step * idx + step / 2 - iconSize / 2;
            const iy = pillY + (pillH - iconSize) / 2;
            if (socImages[idx].complete && socImages[idx].naturalWidth > 0) {
                ctx.globalAlpha = 0.85;
                ctx.drawImage(socImages[idx], ix, iy, iconSize, iconSize);
                ctx.globalAlpha = 1;
            } else {
                // Fallback — белый кружок
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.beginPath();
                ctx.arc(ix + iconSize/2, iy + iconSize/2, iconSize/2, 0, Math.PI*2);
                ctx.fill();
            }
        });
    }

    // Подсказка "нажми" — маленький текст под плашкой
    if (!expanded) {
        ctx.fillStyle = 'rgba(255,255,255,0.30)';
        ctx.font = '22px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Натисни для запису', TW / 2, TH - 22);
    }
}

// Создаём меши карточек
const cardMeshes = [];
CARDS.forEach((data, i) => {
    const angle = (i / CARDS.length) * Math.PI * 2;
    const x = Math.sin(angle) * RADIUS;
    const z = -Math.cos(angle) * RADIUS;

    const cardCanvas = document.createElement('canvas');
    cardCanvas.width  = TW;
    cardCanvas.height = TH;
    drawCard(cardCanvas, data, false);

    const tex = new THREE.CanvasTexture(cardCanvas);
    tex.colorSpace = THREE.SRGBColorSpace;

    const geo = new THREE.PlaneGeometry(CARD_W, CARD_H);
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, 0, z);
    mesh.lookAt(0, 0, 0);
    scene.add(mesh);

    cardMeshes.push({ mesh, angle, tex, cardCanvas, data, index: i });
});

// Перерисовываем карточку (например после раскрытия)
function redrawCard(i) {
    const { cardCanvas, tex, data } = cardMeshes[i];
    drawCard(cardCanvas, data, cardExpanded[i]);
    tex.needsUpdate = true;
}

// Иконки грузим асинхронно — перерисуем все карточки когда загрузятся
socImages.forEach(img => {
    img.onload = () => { cardMeshes.forEach((_, i) => redrawCard(i)); };
});

// ═══════════════════════════════════════
// RAYCASTER — клик по карточке
// ═══════════════════════════════════════
const raycaster = new THREE.Raycaster();
const pointer   = new THREE.Vector2();

function onPointerUp(e) {
    // Координаты в NDC
    const rect = canvas.getBoundingClientRect();
    const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
    const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
    pointer.x =  ((clientX - rect.left) / rect.width)  * 2 - 1;
    pointer.y = -((clientY - rect.top)  / rect.height) * 2 + 1;

    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(cardMeshes.map(c => c.mesh));
    if (!hits.length) return;

    const hit  = hits[0];
    const idx  = cardMeshes.findIndex(c => c.mesh === hit.object);
    if (idx < 0) return;

    // Проверяем попал ли клик в зону плашки
    // UV.y: 0 = низ, 1 = верх. Плашка примерно y < 0.22
    const uv = hit.uv;
    if (uv && uv.y < 0.22) {
        if (cardExpanded[idx]) {
            // Клик по иконке — определяем какой
            const u = uv.x; // 0..1
            const socIdx = Math.floor(u * 5);
            const soc = SOC_ICONS[Math.max(0, Math.min(4, socIdx))];
            window.open(soc.href, '_blank');
        } else {
            // Раскрываем
            cardExpanded[idx] = true;
            redrawCard(idx);
        }
    } else if (cardExpanded[idx]) {
        // Клик вне плашки — закрываем
        cardExpanded[idx] = false;
        redrawCard(idx);
    }
}

canvas.addEventListener('pointerup',  onPointerUp);
canvas.addEventListener('touchend',   onPointerUp, { passive: true });

// ═══════════════════════════════════════
// ГИРОСКОП — deviceorientation W3C стандарт
// Только yaw-калибровка, pitch всегда от вертикали
// ═══════════════════════════════════════
const qTarget  = new THREE.Quaternion();
const qCurrent = new THREE.Quaternion();
let gyroActive = false;
let gyroYawOffset = 0; // только горизонтальная калибровка
let gyroCalibrated = false;

function onDeviceOrientation(e) {
    if (e.alpha == null || e.beta == null || e.gamma == null) return;
    gyroActive = true;

    const toR = Math.PI / 180;

    // W3C стандарт — строим кватернион устройства
    const alpha = e.alpha * toR;
    const beta  = e.beta  * toR;
    const gamma = e.gamma * toR;

    const qZ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),  alpha);
    const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),  beta);
    const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), -gamma);
    const qDev = new THREE.Quaternion().multiply(qZ).multiply(qX).multiply(qY);

    // Переводим из "лежачей" системы координат устройства в "стоячую" камеры
    const qFix = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), -Math.PI/2);
    qDev.premultiply(qFix);

    // Извлекаем Euler YXZ — убиваем крен
    const eu = new THREE.Euler().setFromQuaternion(qDev, 'YXZ');
    eu.z = 0;
    // Pitch: 0 = горизонталь, ограничиваем
    eu.x = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, eu.x));

    // Калибровка — запоминаем только yaw при первом вызове
    if (!gyroCalibrated) {
        gyroYawOffset = eu.y;
        gyroCalibrated = true;
    }

    eu.y -= gyroYawOffset;
    qTarget.setFromEuler(eu);
}

// Сброс калибровки двойным тапом
document.addEventListener('dblclick', () => { gyroCalibrated = false; });
let lastTap = 0;
document.addEventListener('touchend', () => {
    const now = Date.now();
    if (now - lastTap < 300) gyroCalibrated = false;
    lastTap = now;
}, { passive: true });

function startGyro() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
            .then(r => { if (r==='granted') window.addEventListener('deviceorientation', onDeviceOrientation, true); })
            .catch(()=>{});
    } else {
        window.addEventListener('deviceorientation', onDeviceOrientation, true);
    }
}

if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    document.addEventListener('touchstart', function ask() {
        video.play().catch(()=>{});
        startGyro();
        document.removeEventListener('touchstart', ask);
    }, { once: true });
} else {
    startGyro();
}

// ═══════════════════════════════════════
// ДЕСКТОП — pointer lock
// ═══════════════════════════════════════
const eulerMouse = new THREE.Euler(0, 0, 0, 'YXZ');
let mouseDown = false;

document.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    if (e.target.closest('a,button')) return;
    mouseDown = true;
    canvas.requestPointerLock();
});
document.addEventListener('mouseup', () => {
    mouseDown = false;
    if (document.pointerLockElement) document.exitPointerLock();
});
document.addEventListener('mousemove', e => {
    if (!document.pointerLockElement || gyroActive) return;
    eulerMouse.y -= e.movementX * 0.003;
    eulerMouse.x -= e.movementY * 0.002;
    eulerMouse.x = Math.max(-0.6, Math.min(0.6, eulerMouse.x));
    qTarget.setFromEuler(eulerMouse);
});

// ═══════════════════════════════════════
// ЭФФЕКТ ГЛУБИНЫ
// ═══════════════════════════════════════
function updateDepth() {
    const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
    cardMeshes.forEach(({ mesh, angle }) => {
        const cd  = new THREE.Vector3(Math.sin(angle), 0, -Math.cos(angle));
        const dot = Math.max(-1, Math.min(1, dir.dot(cd)));
        const t   = (dot + 1) / 2;
        mesh.material.opacity = 0.4 + t * 0.6;
        mesh.scale.setScalar(0.82 + t * 0.18);
    });
}

// ═══════════════════════════════════════
// АВТОРОТАЦИЯ
// ═══════════════════════════════════════
let autoAngle = 0;
const eulerAuto = new THREE.Euler(0,0,0,'YXZ');

// ═══════════════════════════════════════
// РЕСАЙЗ
// ═══════════════════════════════════════
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Скрываем подсказку
setTimeout(() => { document.getElementById('hint').classList.add('hidden'); }, 4000);

// ═══════════════════════════════════════
// АНИМАЦИЯ
// ═══════════════════════════════════════
(function animate() {
    requestAnimationFrame(animate);

    if (video.readyState >= video.HAVE_CURRENT_DATA) videoTex.needsUpdate = true;

    if (!gyroActive && !document.pointerLockElement) {
        autoAngle += 0.0002;
        eulerAuto.set(0, autoAngle, 0);
        qTarget.setFromEuler(eulerAuto);
    }

    qCurrent.slerp(qTarget, 0.08);
    camera.quaternion.copy(qCurrent);

    updateDepth();
    renderer.render(scene, camera);
})();
</script>
</body>
</html>
