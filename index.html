<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Час для себе — Студія масажу</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        #three-canvas {
            position: fixed;
            inset: 0;
            width: 100%; height: 100%;
        }

        /* ── UI поверх Three.js ── */
        #ui {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }

        /* Заголовок */
        #title-block {
            text-align: center;
            pointer-events: none;
        }
        #title-block h1 {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #fff;
            mix-blend-mode: difference;
        }
        #title-block p {
            margin-top: 4px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.6);
            letter-spacing: 0.5px;
            mix-blend-mode: difference;
        }

        /* Подсказка внизу */
        #hint {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 0.68rem;
            color: rgba(255,255,255,0.35);
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
            pointer-events: none;
            transition: opacity 1s ease;
        }
        #hint.hidden { opacity: 0; }

        /* Кнопка записи */
        #btn-book {
            pointer-events: auto;
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;

            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 0.78rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            mix-blend-mode: difference;

            background: rgba(255,255,255,0.08);
            border: none;
            border-radius: 16px;
            padding: 16px 36px;
            cursor: pointer;
            white-space: nowrap;

            /* Контур */
            box-shadow:
                0 0 0 1.5px rgba(255,255,255,0.5),
                0 8px 32px rgba(0,0,0,0.4);

            transition: box-shadow 0.2s, background 0.2s;
        }
        #btn-book:active {
            background: rgba(255,255,255,0.14);
        }

        /* Соцсети — появляются вместо кнопки */
        #social-row {
            pointer-events: auto;
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        #social-row.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .soc-btn {
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border-radius: 16px;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 1.5px rgba(255,255,255,0.4);
            transition: background 0.2s;
        }
        .soc-btn:active { background: rgba(255,255,255,0.18); }
        .soc-btn img {
            width: 22px; height: 22px;
            filter: brightness(0) invert(1);
            mix-blend-mode: difference;
        }

        /* Индикатор активной карточки */
        #dots {
            position: fixed;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 20;
            pointer-events: none;
        }
        .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            transition: background 0.3s, transform 0.3s;
        }
        .dot.active {
            background: rgba(255,255,255,0.85);
            transform: scale(1.4);
        }
    </style>
</head>
<body>

<canvas id="three-canvas"></canvas>

<!-- UI поверх -->
<div id="ui">
    <div id="title-block">
        <h1>Час для себе</h1>
        <p>Нехай увесь світ зачекає — знайди час для себе</p>
    </div>
</div>

<div id="hint">Поверніть телефон, щоб оглянутись</div>

<button id="btn-book">Записатися на масаж</button>

<div id="social-row">
    <a href="https://threads.net/" target="_blank" class="soc-btn">
        <img src="https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/hreads.svg" alt="Threads">
    </a>
    <a href="https://t.me/username" target="_blank" class="soc-btn">
        <img src="https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/telegram.svg" alt="Telegram">
    </a>
    <a href="https://instagram.com/username" target="_blank" class="soc-btn">
        <img src="https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/insta.svg" alt="Instagram">
    </a>
    <a href="https://wa.me/380000000000" target="_blank" class="soc-btn">
        <img src="https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/wa.svg" alt="WhatsApp">
    </a>
    <a href="tel:+380000000000" class="soc-btn">
        <img src="https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/call.svg" alt="Дзвінок">
    </a>
</div>

<div id="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
</div>

<script>
// ═══════════════════════════════════════════
// ДАННЫЕ КАРТОЧЕК
// ═══════════════════════════════════════════
const CARDS = [
    {
        name: 'Класичний масаж',
        desc: 'Відновлює кровообіг, знімає м\'язову напругу та покращує загальний тонус тіла. Ідеально після важкого тижня.',
        duration: '60 або 90 хв',
        price: '600 / 850 грн',
        color: '#1a1f2e'
    },
    {
        name: 'Глибокий тканинний',
        desc: 'Інтенсивний вплив на глибокі шари м\'язів. Ефективний при хронічних болях та м\'язових затисках.',
        duration: '60 або 90 хв',
        price: '750 / 1050 грн',
        color: '#1e1a2e'
    },
    {
        name: 'Аромамасаж',
        desc: 'М\'які техніки з натуральними ефірними оліями. Заспокоює нервову систему та знімає тривожність.',
        duration: '75 або 90 хв',
        price: '700 / 900 грн',
        color: '#1a2e1e'
    },
    {
        name: 'Масаж спини та шиї',
        desc: 'Знімає головний біль, напругу від сидячої роботи та скутість у плечовому поясі.',
        duration: '30 або 45 хв',
        price: '400 / 550 грн',
        color: '#2e1a1a'
    },
    {
        name: 'Антицелюлітний',
        desc: 'Лімфодренаж та покращення мікроциркуляції. Шкіра стає пружнішою, контури — чіткішими.',
        duration: '45 або 60 хв',
        price: '650 / 850 грн',
        color: '#2e2a1a'
    },
    {
        name: 'Спортивний масаж',
        desc: 'Відновлення після тренувань, профілактика травм, підвищення гнучкості та тонусу м\'язів.',
        duration: '60 хв',
        price: '700 грн',
        color: '#1a2a2e'
    }
];

// ═══════════════════════════════════════════
// THREE.JS SETUP
// ═══════════════════════════════════════════
const canvas = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 0);

// ── Видео-фон (сфера) ──
const video = document.createElement('video');
video.src = 'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/main/SpaceSeamless.mp4';
video.crossOrigin = 'anonymous';
video.loop = true;
video.muted = true;
video.playsInline = true;
video.autoplay = true;
video.play().catch(() => {});

const videoTex = new THREE.VideoTexture(video);
videoTex.colorSpace = THREE.SRGBColorSpace;

const skyGeo = new THREE.SphereGeometry(80, 64, 32);
skyGeo.scale(-1, 1, 1);
const skyMesh = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ map: videoTex }));
scene.add(skyMesh);

// ── Свет ──
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(0, 5, 5);
scene.add(dirLight);

// ═══════════════════════════════════════════
// СОЗДАНИЕ КАРТОЧЕК ЧЕРЕЗ CSS2DRenderer-подобный подход
// Карточки — это HTML-текстуры на PlaneGeometry через CanvasTexture
// ═══════════════════════════════════════════
const RADIUS   = 4.5;   // радиус круга карточек
const CARD_W   = 2.2;   // ширина карточки (world units)
const CARD_H   = 2.8;   // высота карточки
const TEX_W    = 512;
const TEX_H    = 650;

function makeCardTexture(data) {
    const c = document.createElement('canvas');
    c.width  = TEX_W;
    c.height = TEX_H;
    const ctx = c.getContext('2d');

    // Фон карточки — тёмное стекло
    const bg = ctx.createLinearGradient(0, 0, 0, TEX_H);
    bg.addColorStop(0, 'rgba(255,255,255,0.13)');
    bg.addColorStop(1, 'rgba(255,255,255,0.05)');
    ctx.fillStyle = bg;
    roundRect(ctx, 0, 0, TEX_W, TEX_H, 48);
    ctx.fill();

    // Контур
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 3;
    roundRect(ctx, 1.5, 1.5, TEX_W - 3, TEX_H - 3, 47);
    ctx.stroke();

    // Название
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 42px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.textAlign = 'left';
    wrapText(ctx, data.name, 44, 80, TEX_W - 88, 52);

    // Разделитель
    ctx.strokeStyle = 'rgba(255,255,255,0.20)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(44, 115);
    ctx.lineTo(TEX_W - 44, 115);
    ctx.stroke();

    // Описание
    ctx.fillStyle = 'rgba(255,255,255,0.78)';
    ctx.font = '28px -apple-system, BlinkMacSystemFont, sans-serif';
    wrapText(ctx, data.desc, 44, 160, TEX_W - 88, 38);

    // Плашка внизу
    const pill = ctx.createLinearGradient(0, TEX_H - 130, 0, TEX_H - 40);
    pill.addColorStop(0, 'rgba(255,255,255,0.10)');
    pill.addColorStop(1, 'rgba(255,255,255,0.06)');
    ctx.fillStyle = pill;
    roundRect(ctx, 36, TEX_H - 130, TEX_W - 72, 90, 24);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1.5;
    roundRect(ctx, 36, TEX_H - 130, TEX_W - 72, 90, 24);
    ctx.stroke();

    // Длительность · цена
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '30px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(data.duration + '  ·  ' + data.price, TEX_W / 2, TEX_H - 72);

    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function wrapText(ctx, text, x, y, maxW, lineH) {
    const words = text.split(' ');
    let line = '';
    for (let i = 0; i < words.length; i++) {
        const test = line + words[i] + ' ';
        if (ctx.measureText(test).width > maxW && i > 0) {
            ctx.fillText(line.trim(), x, y);
            line = words[i] + ' ';
            y += lineH;
        } else {
            line = test;
        }
    }
    ctx.fillText(line.trim(), x, y);
}

// Размещаем карточки по кругу
const cardMeshes = [];
CARDS.forEach((data, i) => {
    const angle = (i / CARDS.length) * Math.PI * 2;
    const x = Math.sin(angle) * RADIUS;
    const z = -Math.cos(angle) * RADIUS; // начало — прямо перед камерой

    const geo = new THREE.PlaneGeometry(CARD_W, CARD_H);
    const tex = makeCardTexture(data);
    const mat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, 0, z);
    // Карточка смотрит на центр
    mesh.lookAt(0, 0, 0);

    scene.add(mesh);
    cardMeshes.push({ mesh, angle });
});

// ═══════════════════════════════════════════
// УПРАВЛЕНИЕ КАМЕРОЙ
// ═══════════════════════════════════════════
const qTarget  = new THREE.Quaternion();
const qCurrent = new THREE.Quaternion();

// Авторотация по умолчанию
let autoAngle = 0;
const AUTO_SPEED = 0.0002;
let gyroActive = false;
let gyroOffset = null;

// Гироскоп
function onDeviceOrientation(e) {
    if (e.alpha == null) return;
    gyroActive = true;

    // Конвертируем углы устройства в радианы
    const alpha = THREE.MathUtils.degToRad(e.alpha); // компас (Z)
    const beta  = THREE.MathUtils.degToRad(e.beta);  // наклон вперёд/назад (X)
    const gamma = THREE.MathUtils.degToRad(e.gamma); // наклон влево/вправо (Y)

    // Строим Euler сразу в нужном порядке YXZ
    // и явно убиваем крен (Z = 0)
    const deviceEuler = new THREE.Euler(
        beta,    // pitch
        alpha,   // yaw (компас)
        -gamma,  // roll — берём отрицательный чтобы компенсировать
        'YXZ'
    );

    const qDevice = new THREE.Quaternion().setFromEuler(deviceEuler);

    // Поворачиваем систему координат: телефон в портрете смотрит вверх,
    // нам нужно чтобы смотрел вперёд
    const qFix = new THREE.Quaternion().setFromAxisAngle(
        new THREE.Vector3(1, 0, 0), -Math.PI / 2
    );
    qDevice.premultiply(qFix);

    // Извлекаем Euler, ОБНУЛЯЕМ КРЕН, кладём обратно
    const e2 = new THREE.Euler().setFromQuaternion(qDevice, 'YXZ');
    e2.z = 0; // <-- вот здесь убиваем завал горизонта
    qDevice.setFromEuler(e2);

    // Ограничиваем pitch
    const e3 = new THREE.Euler().setFromQuaternion(qDevice, 'YXZ');
    e3.x = Math.max(-0.5, Math.min(0.5, e3.x));
    qDevice.setFromEuler(e3);

    // Калибровка — первое положение = ноль
    if (!gyroOffset) gyroOffset = qDevice.clone().invert();
    qTarget.copy(qDevice).premultiply(gyroOffset);
}

// Десктоп: мышь зажата
const eulerMouse = new THREE.Euler(0, 0, 0, 'YXZ');
document.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    document.body.requestPointerLock();
});
document.addEventListener('mousemove', (e) => {
    if (!document.pointerLockElement || gyroActive) return;
    eulerMouse.y -= e.movementX * 0.003;
    eulerMouse.x -= e.movementY * 0.002;
    eulerMouse.x = Math.max(-0.5, Math.min(0.5, eulerMouse.x));
    qTarget.setFromEuler(eulerMouse);
});

// Сброс калибровки двойным тапом
document.addEventListener('dblclick', () => { gyroOffset = null; });
let lastTap = 0;
document.addEventListener('touchend', () => {
    const now = Date.now();
    if (now - lastTap < 300) gyroOffset = null;
    lastTap = now;
});

function startGyro() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
            .then(r => { if (r === 'granted') window.addEventListener('deviceorientation', onDeviceOrientation, true); })
            .catch(() => {});
    } else {
        window.addEventListener('deviceorientation', onDeviceOrientation, true);
    }
}

if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    document.addEventListener('touchstart', function ask() {
        video.play().catch(() => {});
        startGyro();
        document.removeEventListener('touchstart', ask);
    }, { once: true });
} else {
    startGyro();
}

// ═══════════════════════════════════════════
// ОПРЕДЕЛЕНИЕ АКТИВНОЙ КАРТОЧКИ
// ═══════════════════════════════════════════
const dots = document.querySelectorAll('.dot');
let activeCard = 0;

function updateActiveCard() {
    // Направление взгляда камеры в XZ-плоскости
    const dir = new THREE.Vector3(0, 0, -1);
    dir.applyQuaternion(camera.quaternion);

    let minAngle = Infinity;
    let closest  = 0;

    cardMeshes.forEach(({ angle }, i) => {
        const cardDir = new THREE.Vector3(Math.sin(angle), 0, -Math.cos(angle));
        const dot = dir.dot(cardDir);
        const a = Math.acos(Math.max(-1, Math.min(1, dot)));
        if (a < minAngle) { minAngle = a; closest = i; }
    });

    if (closest !== activeCard) {
        activeCard = closest;
        dots.forEach((d, i) => d.classList.toggle('active', i === activeCard));
    }
}

// ═══════════════════════════════════════════
// ЭФФЕКТ ГЛУБИНЫ: карточки ближние ярче
// ═══════════════════════════════════════════
function updateCardDepth() {
    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    cardMeshes.forEach(({ mesh, angle }) => {
        const cardDir = new THREE.Vector3(Math.sin(angle), 0, -Math.cos(angle));
        const dot = dir.dot(cardDir); // от -1 до 1
        // Нормализуем: 1 = прямо перед, -1 = сзади
        const t = (dot + 1) / 2; // 0..1
        const opacity = 0.35 + t * 0.65;
        const scale   = 0.80 + t * 0.20;
        mesh.material.opacity = opacity;
        mesh.scale.setScalar(scale);
    });
}

// ═══════════════════════════════════════════
// КНОПКА ЗАПИСИ
// ═══════════════════════════════════════════
const btnBook   = document.getElementById('btn-book');
const socialRow = document.getElementById('social-row');
let expanded = false;

btnBook.addEventListener('click', () => {
    expanded = true;
    btnBook.style.opacity = '0';
    btnBook.style.pointerEvents = 'none';
    socialRow.classList.add('visible');
});

document.addEventListener('click', (e) => {
    if (expanded && !e.target.closest('#social-row') && !e.target.closest('#btn-book')) {
        expanded = false;
        socialRow.classList.remove('visible');
        setTimeout(() => {
            btnBook.style.opacity = '1';
            btnBook.style.pointerEvents = 'auto';
        }, 300);
    }
});

// Скрываем подсказку через 4 секунды
setTimeout(() => {
    document.getElementById('hint').classList.add('hidden');
}, 4000);

// ═══════════════════════════════════════════
// РЕСАЙЗ
// ═══════════════════════════════════════════
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// ═══════════════════════════════════════════
// АНИМАЦИЯ
// ═══════════════════════════════════════════
const euler = new THREE.Euler(0, 0, 0, 'YXZ');

(function animate() {
    requestAnimationFrame(animate);

    if (video.readyState >= video.HAVE_CURRENT_DATA) videoTex.needsUpdate = true;

    // Авторотация если нет гироскопа и нет pointer lock
    if (!gyroActive && !document.pointerLockElement) {
        autoAngle += AUTO_SPEED;
        euler.set(0, autoAngle, 0);
        qTarget.setFromEuler(euler);
    }

    qCurrent.slerp(qTarget, 0.07);
    camera.quaternion.copy(qCurrent);

    updateCardDepth();
    updateActiveCard();

    renderer.render(scene, camera);
})();
</script>
</body>
</html>
