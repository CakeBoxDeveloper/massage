<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Час для себе — Студія масажу</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        #panoramaCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
        }

        #edgeBlur {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%,
                transparent 45%, rgba(0,0,0,0.4) 65%, black 85%);
            mask-image: radial-gradient(ellipse 80% 80% at 50% 50%,
                transparent 45%, rgba(0,0,0,0.4) 65%, black 85%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            touch-action: none;
            overscroll-behavior: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 20px 20px 20px;
            overflow: hidden;
            background-color: #0d0e12;
        }

        /* ═══════════════════════════
           GLASS — без блюра, только контур
           ═══════════════════════════ */
        .glass {
            position: relative;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            background: rgba(255, 255, 255, 0.06);
            isolation: isolate;
            overflow: hidden;
        }

        /* Градиентный контур — толстый, с преломлением */
        .glass::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: linear-gradient(
                135deg,
                rgba(255,255,255,0.85) 0%,
                rgba(255,255,255,0.40) 20%,
                rgba(255,255,255,0.08) 45%,
                rgba(0,0,0,0.05) 70%,
                rgba(255,255,255,0.30) 100%
            );
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 2;
        }

        /* Шиммер — ТОЛЬКО по контуру (через padding + mask) */
        .glass::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: linear-gradient(
                105deg,
                rgba(255,255,255,0.00) 0%,
                rgba(255,255,255,0.00) 30%,
                rgba(255,255,255,0.90) 50%,
                rgba(255,255,255,0.00) 70%,
                rgba(255,255,255,0.00) 100%
            );
            background-size: 300% 100%;
            background-position: 150% 0;
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 3;
            animation: shimmer 8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes shimmer {
            0%   { background-position: 150% 0; }
            100% { background-position: -150% 0; }
        }

        /* Разные задержки для разных элементов */
        .header::before       { animation-delay: 0s; }
        .info-card::before    { animation-delay: -3s; }
        .btn-main::before     { animation-delay: -6s; }

        /* ── Инверсия текста ── */
        .inv {
            mix-blend-mode: difference;
            color: #ffffff;
            position: relative;
            z-index: 4;
        }

        /* ═══════ HEADER ═══════ */
        .header {
            width: 100%;
            max-width: 400px;
            padding: 14px 20px;
            border-radius: 20px;
            text-align: center;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 1.45rem;
            font-weight: 500;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            position: relative;
            z-index: 4;
            mix-blend-mode: difference;
            color: #ffffff;
        }

        /* ═══════ LAYOUT ═══════ */
        .container {
            width: 100%;
            max-width: 400px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 12px 0 0 0;
            gap: 12px;
        }

        /* ═══════ КАРТОЧКА — фиксированная высота ═══════ */
        .info-card {
            padding: 20px;
            border-radius: 28px;
            overflow: hidden;
            transition: filter 0.3s ease;
            height: 300px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        .info-card.card-blurring { filter: blur(8px); }

        .card-switcher {
            flex: 1;
            position: relative;
            min-height: 0;
        }

        .view-panel {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            scrollbar-width: none;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            touch-action: pan-y;
            z-index: 2;
        }
        .view-panel::-webkit-scrollbar { display: none; }
        .view-panel.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* ═══════ СПИСОК ═══════ */
        .massage-item {
            border-bottom: 1px solid rgba(255,255,255,0.10);
            cursor: pointer;
            padding: 11px 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            transition: opacity 0.18s ease;
        }
        .massage-item:last-child { border-bottom: none; }
        .massage-item:active { opacity: 0.6; }

        .massage-name {
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.2px;
            mix-blend-mode: difference;
            color: #ffffff;
            position: relative;
            z-index: 4;
        }

        .massage-plus {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 50%;
            font-size: 0.95rem;
            /* сброс line-height чтобы плюс был по центру */
            line-height: 1;
            padding-bottom: 1px;
            mix-blend-mode: difference;
            color: #ffffff;
            position: relative;
            z-index: 4;
        }

        /* ═══════ ДЕТАЛЬНЫЙ ВИД ═══════ */
        .detail-view {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .detail-title {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            flex: 1;
            mix-blend-mode: difference;
            color: #ffffff;
            position: relative;
            z-index: 4;
        }
        .btn-back {
            background: none;
            border: 1px solid rgba(255,255,255,0.20);
            border-radius: 12px;
            font-size: 0.72rem;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            padding: 6px 14px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: border-color 0.2s;
            position: relative;
            z-index: 4;
            mix-blend-mode: difference;
            color: #ffffff;
        }
        .btn-back:hover { border-color: rgba(255,255,255,0.5); }

        .detail-desc {
            font-size: 0.88rem;
            line-height: 1.72;
            flex: 1;
            position: relative;
            z-index: 4;
            mix-blend-mode: difference;
            color: #ffffff;
        }

        .detail-meta-box {
            margin-top: 12px;
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 16px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            position: relative;
            z-index: 4;

        .meta-text {
            font-size: 0.88rem;
            letter-spacing: 0.2px;
            mix-blend-mode: difference;
            color: #ffffff;
            position: relative;
            z-index: 4;
        }
        .meta-sep {
            font-size: 0.88rem;
            mix-blend-mode: difference;
            color: #ffffff;
            opacity: 0.4;
            position: relative;
            z-index: 4;
        }

        /* ═══════ SPACER — толкает кнопку вверх ═══════ */
        .spacer { flex: 1; }

        /* ═══════ КНОПКА ЗАПИСИ ═══════ */
        .contacts-zone {
            width: 100%;
            flex-shrink: 0;
            /* отступ снизу меньше — кнопка выше */
            padding-bottom: 0;
        }
        .btn-wrap {
            position: relative;
            width: 100%;
            height: 56px;
        }
        .btn-main {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            width: 100%;
            height: 56px;
            border: none;
            cursor: pointer;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: width 0.48s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease;
            overflow: hidden;
            /* шиммер только по контуру — не поверх текста */
        }
        .btn-main.collapsed { width: 56px; opacity: 0; pointer-events: none; }

        .btn-main-label {
            pointer-events: none;
            position: relative;
            z-index: 4;
            white-space: nowrap;
            transition: opacity 0.2s ease;
            mix-blend-mode: difference;
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 400;
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }
        .btn-main.collapsed .btn-main-label { opacity: 0; }

        /* ═══════ СОЦСЕТИ ═══════ */
        .social-row {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }
        .social-row.visible { pointer-events: auto; }

        .soc-btn {
            flex: 1;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border-radius: 16px;
            position: relative;
            transform: scaleX(0);
            opacity: 0;
            transform-origin: center;
            transition: transform 0.44s cubic-bezier(0.34,1.3,0.64,1), opacity 0.3s ease;
            overflow: hidden;
        }

        .social-row.visible .soc-btn { transform: scaleX(1); opacity: 1; }
        .social-row.visible .soc-btn:nth-child(3) { transition-delay: 0s; }
        .social-row.visible .soc-btn:nth-child(2) { transition-delay: 0.07s; }
        .social-row.visible .soc-btn:nth-child(4) { transition-delay: 0.07s; }
        .social-row.visible .soc-btn:nth-child(1) { transition-delay: 0.14s; }
        .social-row.visible .soc-btn:nth-child(5) { transition-delay: 0.14s; }

        /* Шиммер на соцсетях — только контур, разные задержки */
        .soc-btn:nth-child(1)::before { animation-delay: -1s; }
        .soc-btn:nth-child(2)::before { animation-delay: -3s; }
        .soc-btn:nth-child(3)::before { animation-delay: -5s; }
        .soc-btn:nth-child(4)::before { animation-delay: -7s; }
        .soc-btn:nth-child(5)::before { animation-delay: -9s; }

        .soc-btn img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            position: relative;
            z-index: 4;
            /* инверсия иконок */
            mix-blend-mode: difference;
            filter: brightness(0) invert(1);
            transition: transform 0.2s;
        }
        .soc-btn:hover img { transform: scale(1.15); }
        .soc-btn:active { opacity: 0.7; }
    </style>

<script>
(function () {
    const canvas   = document.getElementById('panoramaCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 0.001);

    const geometry = new THREE.SphereGeometry(500, 60, 40);
    geometry.scale(-1, 1, 1);

    const video = document.createElement('video');
    video.src = 'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/main/SpaceSeamless.mp4';
    video.crossOrigin = 'anonymous';
    video.loop = true;
    video.muted = true;
    video.playsInline = true;
    video.autoplay = true;
    video.play().catch(() => {});

    const texture = new THREE.VideoTexture(video);
    texture.colorSpace = THREE.SRGBColorSpace;
    scene.add(new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ map: texture })));

    const LERP        = 0.06;
    const DRIFT_SPEED = 0.0003;

    const qTarget  = new THREE.Quaternion();
    const qCurrent = new THREE.Quaternion();
    const eulerDrift = new THREE.Euler(0.4, 0, 0, 'YXZ');

    qTarget.setFromEuler(eulerDrift);
    qCurrent.copy(qTarget);

    let gyroActive = false;
    let gyroOffset = null;

    function onDeviceOrientation(e) {
        if (e.alpha == null || e.beta == null || e.gamma == null) return;
        gyroActive = true;

        const alpha = THREE.MathUtils.degToRad(e.alpha);
        const beta  = THREE.MathUtils.degToRad(e.beta);
        const gamma = THREE.MathUtils.degToRad(e.gamma);

        const qZ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), alpha);
        const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), beta);
        const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), gamma);

        const qDevice = new THREE.Quaternion().multiply(qZ).multiply(qX).multiply(qY);
        const qWorld  = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);
        qDevice.premultiply(qWorld);

        const euler = new THREE.Euler().setFromQuaternion(qDevice, 'YXZ');
        euler.z = 0;
        qDevice.setFromEuler(euler);

        if (!gyroOffset) gyroOffset = qDevice.clone().invert();
        qTarget.copy(qDevice).premultiply(gyroOffset);
    }

    document.addEventListener('dblclick', () => { gyroOffset = null; });
    let lastTap = 0;
    document.addEventListener('touchend', () => {
        const now = Date.now();
        if (now - lastTap < 300) gyroOffset = null;
        lastTap = now;
    });

    function startGyro() {
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission()
                .then(res => {
                    if (res === 'granted')
                        window.addEventListener('deviceorientation', onDeviceOrientation, true);
                }).catch(() => {});
        } else {
            window.addEventListener('deviceorientation', onDeviceOrientation, true);
        }
    }

    if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        document.addEventListener('touchstart', function ask() {
            video.play().catch(() => {});
            startGyro();
            document.removeEventListener('touchstart', ask);
        }, { once: true });
    } else {
        startGyro();
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        gyroOffset = null;
    });

    (function animate() {
        requestAnimationFrame(animate);
        if (video.readyState >= video.HAVE_CURRENT_DATA) texture.needsUpdate = true;

        if (!gyroActive) {
            eulerDrift.y += DRIFT_SPEED;
            qTarget.setFromEuler(eulerDrift);
        }

        qCurrent.slerp(qTarget, LERP);
        camera.quaternion.copy(qCurrent);
        renderer.render(scene, camera);
    })();
})();
</script>

<script>

    const detailView     = document.getElementById('detailView');
    const detailName     = document.getElementById('detailName');
    const detailDesc     = document.getElementById('detailDesc');
    const detailDuration = document.getElementById('detailDuration');
    const detailPrice    = document.getElementById('detailPrice');
    const btnBack        = document.getElementById('btnBack');
    const BLUR_DUR       = 300;

    function blurSwitch(fn) {
        card.classList.add('card-blurring');
        setTimeout(() => { fn(); card.classList.remove('card-blurring'); }, BLUR_DUR);
    }

    document.querySelectorAll('.massage-item').forEach(item => {
        item.addEventListener('click', () => {
            blurSwitch(() => {
                detailName.textContent     = item.dataset.name;
                detailDesc.textContent     = item.dataset.desc;
                detailDuration.textContent = item.dataset.duration;
                detailPrice.textContent    = item.dataset.price;
                listView.classList.add('hidden');
                detailView.classList.remove('hidden');
            });
        });
    });

    btnBack.addEventListener('click', () => {
        blurSwitch(() => {
            detailView.classList.add('hidden');
            listView.classList.remove('hidden');
        });
    });

    const btnMain   = document.getElementById('btnMain');
    const socialRow = document.getElementById('socialRow');
    let expanded = false;

    btnMain.addEventListener('click', () => {
        expanded = true;
        btnMain.classList.add('collapsed');
        socialRow.classList.add('visible');
    });

    document.addEventListener('click', (e) => {
        if (expanded && !e.target.closest('.contacts-zone')) {
            expanded = false;
            socialRow.classList.remove('visible');
            setTimeout(() => btnMain.classList.remove('collapsed'), 150);
        }
    });

    /* ── Параллакс UI ── */
    const MAX_SHIFT = 14;
    const LERP_UI   = 0.06;
    let uiTX = 0, uiTY = 0, uiCX = 0, uiCY = 0;
    let uiGyro = false;

    (function uiLoop() {
        uiCX += (uiTX - uiCX) * LERP_UI;
        uiCY += (uiTY - uiCY) * LERP_UI;
        document.querySelector('.header').style.transform =
            `translateX(${-uiCX * 0.15}px) translateY(${-uiCY * 0.15}px)`;
        document.querySelector('.container').style.transform =
            `translateX(${-uiCX * 0.08}px) translateY(${-uiCY * 0.08}px)`;
        requestAnimationFrame(uiLoop);
    })();

    window.addEventListener('deviceorientation', (e) => {
        uiGyro = true;
        uiTX = Math.max(-45, Math.min(45, e.gamma || 0)) / 45 * MAX_SHIFT;
        uiTY = Math.max(-45, Math.min(45, e.beta  || 0)) / 45 * MAX_SHIFT * 0.6;
    }, true);

    document.addEventListener('mousemove', (e) => {
        if (uiGyro) return;
        uiTX = ((e.clientX - window.innerWidth  / 2) / (window.innerWidth  / 2)) * MAX_SHIFT;
        uiTY = ((e.clientY - window.innerHeight / 2) / (window.innerHeight / 2)) * MAX_SHIFT * 0.6;
    });
    document.addEventListener('mouseleave', () => {
        if (!uiGyro) { uiTX = 0; uiTY = 0; }
    });

});
</script>

</body>
</html>
