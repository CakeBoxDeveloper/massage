<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Paradise Garden</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }
  #gc { position:fixed; inset:0; width:100%; height:100%; display:block; }

  #overlay {
    position:fixed; inset:0; pointer-events:none;
    z-index:10;
  }

  .card {
    position:absolute;
    width:200px;           /* базовый, масштабируется через scale */
    border-radius:20px;
    backdrop-filter: blur(22px) saturate(1.4);
    -webkit-backdrop-filter: blur(22px) saturate(1.4);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.45);
    box-shadow: 0 4px 32px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.25);
    padding: 22px 20px 18px;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, Helvetica, sans-serif;
    pointer-events: auto;
    cursor: pointer;
    transform-origin: center center;
    transition: opacity 0.2s, transform 0.2s;
    user-select: none;
    -webkit-user-select: none;
    /* центрируем по якорной точке */
    transform: translate(-50%, -50%) scale(1);
  }

  .card h2 {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 8px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }
  .card .sep {
    height: 1px;
    background: rgba(255,255,255,0.22);
    margin-bottom: 10px;
  }
  .card .desc {
    font-size: 13px;
    line-height: 1.5;
    color: rgba(255,255,255,0.88);
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
    margin-bottom: 14px;
  }
  .card .pill {
    background: rgba(255,255,255,0.13);
    border: 1px solid rgba(255,255,255,0.30);
    border-radius: 12px;
    text-align: center;
    padding: 10px 8px;
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  .card .soc-row {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 6px 0;
  }
  .card .soc-row a {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px;
    pointer-events: auto;
  }
  .card .soc-row img {
    width: 28px; height: 28px;
    filter: brightness(0) invert(1);
    opacity: 0.9;
  }

  #hint {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    font-size:14px; color:rgba(255,255,255,0.85); pointer-events:none;
    background:rgba(0,0,0,0.3); padding:5px 16px; border-radius:20px;
    transition:opacity 1.2s; font-family:sans-serif; z-index:20;
  }
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="overlay"></div>
<div id="hint">Тяните мышью для поворота</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function(){

var CARDS = [
  { name:'Классический массаж',   desc:'Восстанавливает кровообращение, снимает мышечное напряжение и улучшает общий тонус тела. Идеально после тяжёлой недели.',   duration:'60 или 90 мин', price:'600 / 850 грн'  },
  { name:'Глубокотканный',        desc:'Интенсивное воздействие на глубокие слои мышц. Эффективен при хронических болях и мышечных зажимах после стресса.',        duration:'60 или 90 мин', price:'750 / 1050 грн' },
  { name:'Аромамассаж',           desc:'Мягкие техники с натуральными эфирными маслами. Успокаивает нервную систему и наполняет тело ощущением лёгкости.',          duration:'75 или 90 мин', price:'700 / 900 грн'  },
  { name:'Массаж спины и шеи',    desc:'Снимает головную боль, напряжение от сидячей работы и скованность в плечевом поясе. Результат с первого сеанса.',          duration:'30 или 45 мин', price:'400 / 550 грн'  },
  { name:'Антицеллюлитный',       desc:'Лимфодренаж и улучшение микроциркуляции. Кожа становится упругей, контуры — чётче. Курс от 8 сеансов.',                    duration:'45 или 60 мин', price:'650 / 850 грн'  },
  { name:'Спортивный массаж',     desc:'Восстановление после тренировок, профилактика травм, повышение гибкости и тонуса мышц. До и после нагрузок.',               duration:'60 мин',        price:'700 грн'        },
];

var SOC = [
  { href:'https://threads.net/',           src:'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/hreads.svg'   },
  { href:'https://t.me/username',          src:'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/telegram.svg' },
  { href:'https://instagram.com/username', src:'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/insta.svg'    },
  { href:'https://wa.me/380000000000',     src:'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/wa.svg'       },
  { href:'tel:+380000000000',              src:'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/call.svg'     },
];

/* ── Renderer ── */
var canvas = document.getElementById('gc');
var W = window.innerWidth, H = window.innerHeight;

var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.autoClear = false;

var skyScene = new THREE.Scene();
var camera    = new THREE.PerspectiveCamera(75, W/H, 0.1, 500);
var skyCamera = new THREE.PerspectiveCamera(75, W/H, 1, 1000);
camera.position.set(0, 1.6, 0);

var loader = new THREE.TextureLoader();
loader.crossOrigin = 'anonymous';

/* ── Sky ── */
var skyGeo = new THREE.SphereGeometry(500, 64, 32);
skyGeo.scale(-1, 1, 1);
var skyMat = new THREE.ShaderMaterial({
  uniforms:{top:{value:new THREE.Color(0x2a6fbe)},bot:{value:new THREE.Color(0xb0cfe8)}},
  vertexShader:'varying vec3 vP; void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top,bot;varying vec3 vP;void main(){float h=clamp(normalize(vP).y*2.,0.,1.);gl_FragColor=vec4(mix(bot,top,h),1.);}'
});
var skyMesh = new THREE.Mesh(skyGeo, skyMat);
skyScene.add(skyMesh);

loader.load(
  'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/main/%7B__prompt____An_equirectangular_360-degree_202606110114.jpeg',
  function(tex){
    tex.encoding = THREE.sRGBEncoding;
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    skyMesh.material = new THREE.MeshBasicMaterial({ map: tex, side: THREE.FrontSide });
  }
);

/* ── HTML Cards ── */
var RADIUS = 5.5;
var CARD_Y = 0.0; /* смещение от уровня камеры (camera.y = 1.6) */

var overlay   = document.getElementById('overlay');
var cardExpanded = new Array(CARDS.length).fill(false);
var cardEls   = [];
var cardPos3D = []; /* THREE.Vector3 для каждой карточки */

var tmpV = new THREE.Vector3();

CARDS.forEach(function(data, i){
  var angle = (i / CARDS.length) * Math.PI * 2;
  var x = Math.sin(angle) * RADIUS;
  var z = -Math.cos(angle) * RADIUS;

  cardPos3D.push(new THREE.Vector3(x, CARD_Y, z));

  var el = document.createElement('div');
  el.className = 'card';
  el.innerHTML =
    '<h2>' + data.name + '</h2>' +
    '<div class="sep"></div>' +
    '<div class="desc">' + data.desc + '</div>' +
    '<div class="pill" data-pill>' + data.duration + '  ·  ' + data.price + '</div>';
  overlay.appendChild(el);

  /* клик */
  (function(idx, cardEl, d){
    cardEl.addEventListener('click', function(e){
      e.stopPropagation();
      if(!cardExpanded[idx]){
        /* открываем соцсети */
        cardExpanded[idx] = true;
        var pill = cardEl.querySelector('[data-pill]');
        pill.innerHTML = '';
        var row = document.createElement('div');
        row.className = 'soc-row';
        SOC.forEach(function(s){
          var a = document.createElement('a');
          a.href = s.href; a.target = '_blank';
          a.addEventListener('click', function(ev){ ev.stopPropagation(); });
          var img = document.createElement('img');
          img.src = s.src; img.crossOrigin = 'anonymous';
          a.appendChild(img);
          row.appendChild(a);
        });
        pill.appendChild(row);
      } else {
        /* закрываем */
        cardExpanded[idx] = false;
        var pill = cardEl.querySelector('[data-pill]');
        pill.innerHTML = d.duration + '  ·  ' + d.price;
      }
    });
  })(i, el, data);

  cardEls.push(el);
});

/* закрыть карточку при клике на фон */
canvas.addEventListener('click', function(){
  cardEls.forEach(function(el, i){
    if(cardExpanded[i]){
      cardExpanded[i] = false;
      var pill = el.querySelector('[data-pill]');
      pill.innerHTML = CARDS[i].duration + '  ·  ' + CARDS[i].price;
    }
  });
});

/* ── Проекция 3D → экран ── */
function projectCard(pos3d){
  tmpV.copy(pos3d);
  tmpV.project(camera);
  return {
    x: ( tmpV.x * 0.5 + 0.5) * W,
    y: (-tmpV.y * 0.5 + 0.5) * H,
    z:  tmpV.z  /* -1..1, <1 = перед камерой */
  };
}

function updateCards(){
  var camDir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  cardEls.forEach(function(el, i){
    var pos = cardPos3D[i];
    var pr  = projectCard(pos);

    /* вектор к карточке от камеры */
    var toCard = new THREE.Vector3(pos.x, pos.y, pos.z)
      .sub(camera.position).normalize();
    var dot = camDir.dot(toCard); /* 1=прямо впереди, -1=сзади */
    var t   = (dot + 1) / 2;

    /* за спиной — скрыть */
    if(pr.z >= 1 || dot < -0.1){
      el.style.opacity = '0';
      el.style.pointerEvents = 'none';
      return;
    }

    var sc = 0.72 + t * 0.28;         /* масштаб 0.72–1.0 */
    var op = 0.30 + t * 0.70;         /* прозрачность 0.30–1.0 */

    el.style.opacity = op.toFixed(3);
    el.style.pointerEvents = op > 0.5 ? 'auto' : 'none';
    el.style.left = pr.x + 'px';
    el.style.top  = pr.y + 'px';
    el.style.transform = 'translate(-50%,-50%) scale(' + sc.toFixed(3) + ')';
    el.style.zIndex = Math.round(t * 100);
  });
}

/* ── Resize ── */
window.addEventListener('resize', function(){
  W = window.innerWidth; H = window.innerHeight;
  camera.aspect = skyCamera.aspect = W/H;
  camera.updateProjectionMatrix();
  skyCamera.updateProjectionMatrix();
  renderer.setSize(W, H);
});

/* ── Controls ── */
var qT=new THREE.Quaternion(), qC=new THREE.Quaternion();
var _e=new THREE.Euler(), _q1=new THREE.Quaternion(), _q2=new THREE.Quaternion();
var gyroOn=false, SLERP=0.07;
var dy=0, dp=0.05, dn=false, lx=null, ly=null;
_e.set(dp,dy,0,'YXZ'); qT.setFromEuler(_e);

function screenAngle(){ return (window.screen&&window.screen.orientation)?(window.screen.orientation.angle||0):(window.orientation||0); }
function onOri(e){
  if(e.alpha===null) return; gyroOn=true;
  _e.set(THREE.MathUtils.degToRad(e.beta),THREE.MathUtils.degToRad(e.alpha),-THREE.MathUtils.degToRad(e.gamma),'YXZ');
  qT.setFromEuler(_e);
  _q1.setFromAxisAngle(new THREE.Vector3(1,0,0),-Math.PI/2); qT.multiply(_q1);
  _q2.setFromAxisAngle(new THREE.Vector3(0,0,1),THREE.MathUtils.degToRad(screenAngle())); qT.multiply(_q2);
}
function startGyro(){
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(function(s){if(s==='granted')window.addEventListener('deviceorientation',onOri,true);}).catch(function(){});
  } else { window.addEventListener('deviceorientation',onOri,true); }
}
var permDone=false;
document.addEventListener('touchstart',function(){if(!permDone){permDone=true;startGyro();}},{once:true});
startGyro();

canvas.addEventListener('mousedown',function(e){dn=true;lx=e.clientX;ly=e.clientY;});
window.addEventListener('mouseup',function(){dn=false;});
window.addEventListener('mousemove',function(e){
  if(!dn||gyroOn) return;
  dy-=(e.clientX-lx)*0.003; dp-=(e.clientY-ly)*0.003;
  dp=Math.max(-0.5,Math.min(1.4,dp)); lx=e.clientX; ly=e.clientY;
  _e.set(dp,dy,0,'YXZ'); qT.setFromEuler(_e);
});
var tx=null,ty=null;
canvas.addEventListener('touchstart',function(e){if(!gyroOn){var t=e.touches[0];tx=t.clientX;ty=t.clientY;}},{passive:true});
canvas.addEventListener('touchmove',function(e){
  if(gyroOn) return; var t=e.touches[0];
  if(tx!==null){dy-=(t.clientX-tx)*0.004;dp-=(t.clientY-ty)*0.004;dp=Math.max(-0.5,Math.min(1.4,dp));_e.set(dp,dy,0,'YXZ');qT.setFromEuler(_e);}
  tx=t.clientX; ty=t.clientY;
},{passive:true});

setTimeout(function(){var h=document.getElementById('hint');if(h)h.style.opacity='0';},3500);

/* ── Render loop ── */
var animId=null;
function animate(){
  animId = requestAnimationFrame(animate);
  qC.slerp(qT, SLERP);
  camera.quaternion.copy(qC);
  skyCamera.quaternion.copy(qC);
  updateCards();
  renderer.clear();
  renderer.render(skyScene, skyCamera);
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){cancelAnimationFrame(animId);animId=null;}
  else if(!animId) animate();
});
animate();

})();
</script>
</body>
</html>
