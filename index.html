<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gyro Skybox</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000008);

  var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  scene.add(camera);

  var RADIUS = 50;
  var sphereGeo = new THREE.SphereGeometry(RADIUS, 32, 24);
  sphereGeo.scale(-1, 1, 1);
  var sphereMat = new THREE.MeshBasicMaterial({
    color: 0x00ffcc, wireframe: true, transparent: true, opacity: 0.3
  });
  var sphere = new THREE.Mesh(sphereGeo, sphereMat);
  scene.add(sphere);

  var ringGeo = new THREE.TorusGeometry(RADIUS * 0.55, 0.07, 4, 90);
  var ringMat = new THREE.MeshBasicMaterial({ color: 0x0055ff, transparent: true, opacity: 0.18 });
  var ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2;
  scene.add(ring);

  var starPos = new Float32Array(600 * 3);
  for (var i = 0; i < 600 * 3; i++) starPos[i] = (Math.random() - 0.5) * RADIUS * 1.7;
  var starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 })));

  /* ---- Quaternion-based orientation ---- */
  /* We keep a target quaternion and slerp the camera toward it each frame.
     This completely avoids gimbal lock and horizon flipping. */

  var qTarget = new THREE.Quaternion();
  var qCurrent = new THREE.Quaternion();
  var SLERP = 0.07;

  /* Reusable objects */
  var _euler = new THREE.Euler();
  var _q1 = new THREE.Quaternion();
  var _q2 = new THREE.Quaternion();

  /* Correct for screen orientation so portrait/landscape both work */
  function getScreenOrientationAngle() {
    if (window.screen && window.screen.orientation && window.screen.orientation.angle !== undefined)
      return window.screen.orientation.angle;
    return window.orientation || 0;
  }

  var gyroActive = false;

  function onDeviceOrientation(e) {
    if (e.alpha === null || e.beta === null || e.gamma === null) return;
    gyroActive = true;

    var alpha = THREE.MathUtils.degToRad(e.alpha);
    var beta  = THREE.MathUtils.degToRad(e.beta);
    var gamma = THREE.MathUtils.degToRad(e.gamma);

    /* Standard W3C device orientation -> camera quaternion conversion.
       Uses the approach from THREE.DeviceOrientationControls source,
       which is numerically stable across all orientations. */
    _euler.set(beta, alpha, -gamma, 'YXZ');
    qTarget.setFromEuler(_euler);

    /* Rotate from device frame to Three.js camera frame */
    _q1.setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);
    qTarget.multiply(_q1);

    /* Account for screen orientation */
    var orient = THREE.MathUtils.degToRad(getScreenOrientationAngle());
    _q2.setFromAxisAngle(new THREE.Vector3(0, 0, 1), orient);
    qTarget.multiply(_q2);
  }

  function requestGyro() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission()
        .then(function(state) {
          if (state === 'granted')
            window.addEventListener('deviceorientation', onDeviceOrientation, true);
        }).catch(function() {});
    } else {
      window.addEventListener('deviceorientation', onDeviceOrientation, true);
    }
  }

  /* On iOS we need a user gesture to request permission.
     We use the first touchstart as that gesture. */
  var permRequested = false;
  document.addEventListener('touchstart', function onTouch() {
    if (!permRequested) {
      permRequested = true;
      requestGyro();
    }
  }, { once: true });
  /* On Android/desktop try immediately */
  requestGyro();

  /* ---- Mouse / touch drag fallback ---- */
  var dragYaw = 0, dragPitch = 0;
  var lastX = null, lastY = null;
  var isDragging = false;

  renderer.domElement.addEventListener('mousedown', function(e) {
    isDragging = true; lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener('mouseup', function() { isDragging = false; lastX = null; lastY = null; });
  window.addEventListener('mousemove', function(e) {
    if (!isDragging || gyroActive) return;
    dragYaw   -= (e.clientX - lastX) * 0.003;
    dragPitch -= (e.clientY - lastY) * 0.003;
    dragPitch  = Math.max(-1.4, Math.min(1.4, dragPitch));
    lastX = e.clientX; lastY = e.clientY;
    _euler.set(dragPitch, dragYaw, 0, 'YXZ');
    qTarget.setFromEuler(_euler);
  });

  var tLastX = null, tLastY = null;
  renderer.domElement.addEventListener('touchstart', function(e) {
    var t = e.touches[0]; tLastX = t.clientX; tLastY = t.clientY;
  }, { passive: true });
  renderer.domElement.addEventListener('touchmove', function(e) {
    if (gyroActive) return;
    var t = e.touches[0];
    if (tLastX !== null) {
      dragYaw   -= (t.clientX - tLastX) * 0.004;
      dragPitch -= (t.clientY - tLastY) * 0.004;
      dragPitch  = Math.max(-1.4, Math.min(1.4, dragPitch));
      _euler.set(dragPitch, dragYaw, 0, 'YXZ');
      qTarget.setFromEuler(_euler);
    }
    tLastX = t.clientX; tLastY = t.clientY;
  }, { passive: true });

  /* ---- Resize ---- */
  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ---- Render loop ---- */
  var animId = null;
  var tick = 0;

  function animate() {
    animId = requestAnimationFrame(animate);
    tick += 0.004;
    sphere.rotation.y = tick * 0.04;
    ring.rotation.z   = tick * 0.025;

    /* Slerp camera quaternion — no gimbal lock possible */
    qCurrent.slerp(qTarget, SLERP);
    camera.quaternion.copy(qCurrent);

    renderer.render(scene, camera);
  }

  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      cancelAnimationFrame(animId); animId = null;
    } else if (!animId) {
      animate();
    }
  });

  animate();
})();
</script>
</body>
</html>
