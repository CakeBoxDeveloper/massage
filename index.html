
<div style="width:100%;height:560px;position:relative;overflow:hidden;border-radius:var(--border-radius-lg);">
<canvas id="gc" style="display:block;width:100%;height:100%;"></canvas>
<div id="hint" style="position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:13px;color:rgba(255,255,255,0.85);pointer-events:none;background:rgba(0,0,0,0.3);padding:4px 14px;border-radius:20px;transition:opacity 1.2s;">Тяните мышью для поворота</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function(){
  var canvas = document.getElementById('gc');
  var W = canvas.parentElement.offsetWidth, H = 560;
  canvas.width = W; canvas.height = H;

  var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(W, H);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.autoClear = false;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var skyScene  = new THREE.Scene();
  var mainScene = new THREE.Scene();
  mainScene.fog = new THREE.FogExp2(0x9aaf80, 0.008);

  var aspect = W / H;
  var camera    = new THREE.PerspectiveCamera(75, aspect, 0.1, 500);
  var skyCamera = new THREE.PerspectiveCamera(75, aspect, 1, 1000);
  camera.position.set(0, 1.6, 0);

  var skyGeo = new THREE.SphereGeometry(500, 64, 32);
  skyGeo.scale(-1, 1, 1);
  var skyMat = new THREE.ShaderMaterial({
    uniforms:{top:{value:new THREE.Color(0x2a6fbe)},bot:{value:new THREE.Color(0xb0cfe8)}},
    vertexShader:`varying vec3 vP; void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`uniform vec3 top,bot; varying vec3 vP; void main(){float h=clamp(normalize(vP).y*2.,0.,1.);gl_FragColor=vec4(mix(bot,top,h),1.);}`
  });
  var skyMesh = new THREE.Mesh(skyGeo, skyMat);
  skyScene.add(skyMesh);

  var patch = new THREE.Mesh(new THREE.CircleGeometry(499,64), new THREE.MeshBasicMaterial({color:0x7a8c55}));
  patch.rotation.x = -Math.PI/2; patch.position.y = -30;
  skyScene.add(patch);

  var loader = new THREE.TextureLoader();
  loader.crossOrigin = 'anonymous';
  var BASE = 'https://cdn.jsdelivr.net/gh/CakeBoxDeveloper/massage@main/';

  loader.load(BASE+'Sky.webp', function(tex){
    tex.encoding = THREE.sRGBEncoding;
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.offset.set(0.5, -0.02);
    skyMesh.material = new THREE.MeshBasicMaterial({map:tex});
  });

  var REPEAT = 36; /* вдвое больше тайлов = вдвое мельче */

  var groundMat = new THREE.MeshStandardMaterial({color:0x6a9a4a, roughness:0.85, metalness:0.0});
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(200,200,128,128), groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  mainScene.add(ground);

  function applyTex(tex, r){
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(r, r);
    return tex;
  }

  loader.load(BASE+'Lite2forest_floor_albedo.webp', function(tex){
    tex.encoding = THREE.sRGBEncoding;
    groundMat.map = applyTex(tex, REPEAT);
    groundMat.color.set(0xffffff);
    groundMat.needsUpdate = true;
  });
  loader.load(BASE+'Lite2forest_floor_Normal-ogl.webp', function(tex){
    groundMat.normalMap = applyTex(tex, REPEAT);
    groundMat.normalScale.set(1.2, 1.2);
    groundMat.needsUpdate = true;
  });

  mainScene.add(new THREE.AmbientLight(0xfff0d0, 0.6));
  var sun = new THREE.DirectionalLight(0xffeebb, 1.4);
  sun.position.set(60,80,-40); sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.near=1; sun.shadow.camera.far=300;
  sun.shadow.camera.left=sun.shadow.camera.bottom=-80;
  sun.shadow.camera.right=sun.shadow.camera.top=80;
  mainScene.add(sun);

  var qT=new THREE.Quaternion(), qC=new THREE.Quaternion();
  var _e=new THREE.Euler(), _q1=new THREE.Quaternion(), _q2=new THREE.Quaternion();
  var gyroOn=false, SLERP=0.07;
  var dy=0, dp=0.05, dn=false, lx=null, ly=null;
  _e.set(dp,dy,0,'YXZ'); qT.setFromEuler(_e);

  function screenAngle(){ return (window.screen&&window.screen.orientation)?(window.screen.orientation.angle||0):(window.orientation||0); }
  function onOri(e){
    if(e.alpha===null) return; gyroOn=true;
    _e.set(THREE.MathUtils.degToRad(e.beta),THREE.MathUtils.degToRad(e.alpha),-THREE.MathUtils.degToRad(e.gamma),'YXZ');
    qT.setFromEuler(_e);
    _q1.setFromAxisAngle(new THREE.Vector3(1,0,0),-Math.PI/2); qT.multiply(_q1);
    _q2.setFromAxisAngle(new THREE.Vector3(0,0,1),THREE.MathUtils.degToRad(screenAngle())); qT.multiply(_q2);
  }
  window.addEventListener('deviceorientation',onOri,true);

  canvas.addEventListener('mousedown',function(e){dn=true;lx=e.clientX;ly=e.clientY;});
  window.addEventListener('mouseup',function(){dn=false;});
  window.addEventListener('mousemove',function(e){
    if(!dn||gyroOn) return;
    dy-=(e.clientX-lx)*0.003; dp-=(e.clientY-ly)*0.003;
    dp=Math.max(-0.5,Math.min(1.4,dp)); lx=e.clientX; ly=e.clientY;
    _e.set(dp,dy,0,'YXZ'); qT.setFromEuler(_e);
  });
  var tx=null,ty=null;
  canvas.addEventListener('touchstart',function(e){if(!gyroOn){var t=e.touches[0];tx=t.clientX;ty=t.clientY;}},{passive:true});
  canvas.addEventListener('touchmove',function(e){
    if(gyroOn) return; var t=e.touches[0];
    if(tx!==null){dy-=(t.clientX-tx)*0.004;dp-=(t.clientY-ty)*0.004;dp=Math.max(-0.5,Math.min(1.4,dp));_e.set(dp,dy,0,'YXZ');qT.setFromEuler(_e);}
    tx=t.clientX; ty=t.clientY;
  },{passive:true});

  setTimeout(function(){var h=document.getElementById('hint');if(h)h.style.opacity='0';},3500);

  var animId=null;
  function animate(){
    animId=requestAnimationFrame(animate);
    qC.slerp(qT,SLERP);
    camera.quaternion.copy(qC);
    skyCamera.quaternion.copy(qC);
    renderer.clear();
    renderer.render(skyScene,skyCamera);
    renderer.clearDepth();
    renderer.render(mainScene,camera);
  }
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(animId);animId=null;}
    else if(!animId) animate();
  });
  animate();
})();
</script>
