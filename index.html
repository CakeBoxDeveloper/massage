<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Час для себе — Студія масажу</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        #panoramaCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
        }
    </style>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 20px 30px 20px;
            overflow: hidden;
            background-color: #0d0e12;
        }

        .glass {
            backdrop-filter: blur(1.5px) saturate(120%);
            -webkit-backdrop-filter: blur(1.5px) saturate(120%);
            background: rgba(255,255,255,0.04);
            box-shadow: 0 4px 24px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.12);
            position: relative;
        }
        .glass::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(45deg,rgba(255,255,255,0.02) 0%,rgba(255,255,255,0.02) 40%,rgba(255,255,255,0.45) 50%,rgba(255,255,255,0.02) 60%,rgba(255,255,255,0.02) 100%);
            background-size: 300% 100%;
            background-position: 150% 0;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 3;
            animation: shimmer 14s cubic-bezier(0.25,1,0.5,1) infinite;
        }
        @keyframes shimmer {
            0%   { background-position: 150% 0; }
            100% { background-position: -150% 0; }
        }

        .oil-canvas {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            border-radius: inherit;
        }

        /* ===== HEADER ===== */
        .header {
            width: 100%;
            max-width: 400px;
            padding: 16px 20px;
            border-radius: 20px;
            text-align: center;
            flex-shrink: 0;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .header::before { animation-delay: -2s; }
        .header h1 {
            font-size: 1.45rem;
            font-weight: 500;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            position: relative;
            z-index: 2;
        }

        /* ===== LAYOUT ===== */
        .container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 16px;
            min-height: 0;
        }

        /* ===== CARD ===== */
        .info-card {
            padding: 20px;
            border-radius: 28px;
            flex-shrink: 0;
            overflow: hidden;
            transition: filter 0.3s ease;
            display: grid;
            grid-template-rows: 1fr;
            height: 320px;
        }
        .info-card::before { animation-delay: -5s; }
        .info-card.card-blurring { filter: blur(8px); }

        .card-switcher {
            display: grid;
            grid-template-rows: 1fr;
            min-height: 0;
        }

        .view-panel {
            grid-row: 1;
            grid-column: 1;
            overflow-y: auto;
            scrollbar-width: none;
            transition: opacity 0.3s ease;
        }
        .view-panel::-webkit-scrollbar { display: none; }
        .view-panel.hidden {
            visibility: hidden;
            pointer-events: none;
            opacity: 0;
            position: absolute;
            inset: 0;
        }

        /* ===== СПИСОК ===== */
        .massage-list { position: relative; z-index: 2; }

        .massage-item {
            border-bottom: 1px solid rgba(255,255,255,0.10);
            cursor: pointer;
            padding: 14px 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            transition: opacity 0.18s ease;
        }
        .massage-item:last-child { border-bottom: none; }
        .massage-item:active { opacity: 0.6; }

        .massage-name {
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .massage-plus {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 50%;
            color: rgba(255,255,255,0.45);
            font-size: 1rem;
            line-height: 1;
        }

        /* ===== ДЕТАЛЬНЫЙ ВИД ===== */
        .detail-view {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            z-index: 2;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .detail-title {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            flex: 1;
        }
        .btn-back {
            background: none;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: rgba(255,255,255,0.5);
            font-size: 0.72rem;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            padding: 6px 14px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: border-color 0.2s, color 0.2s;
        }
        .btn-back:hover { border-color: rgba(255,255,255,0.35); color: rgba(255,255,255,0.8); }

        .detail-desc {
            font-size: 0.88rem;
            line-height: 1.72;
            color: rgba(255,255,255,0.75);
            flex: 1;
        }

        .detail-meta-box {
            margin-top: 20px;
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 16px;
            padding: 14px 18px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .meta-text {
            font-size: 0.88rem;
            color: rgba(255,255,255,0.70);
            letter-spacing: 0.2px;
        }
        .meta-sep {
            color: rgba(255,255,255,0.25);
            font-size: 0.88rem;
        }

        /* ===== КНОПКИ ===== */
        .contacts-zone {
            width: 100%;
            flex-shrink: 0;
            margin-bottom: 5px;
        }
        .btn-wrap {
            position: relative;
            width: 100%;
            height: 58px;
        }
        .btn-main {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            width: 100%;
            height: 58px;
            border: none;
            cursor: pointer;
            border-radius: 18px;
            font-size: 0.82rem;
            font-weight: 400;
            letter-spacing: 1.8px;
            color: rgba(255,255,255,0.65);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 10;
            transition: width 0.48s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease;
        }
        .btn-main.collapsed { width: 58px; opacity: 0; pointer-events: none; }
        .btn-main-label {
            pointer-events: none;
            position: relative;
            z-index: 2;
            white-space: nowrap;
            transition: opacity 0.2s ease;
        }
        .btn-main.collapsed .btn-main-label { opacity: 0; }

        .social-row {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }
        .social-row.visible { pointer-events: auto; }

        .soc-btn {
            flex: 1;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            transform: scaleX(0);
            opacity: 0;
            transform-origin: center;
            transition: transform 0.44s cubic-bezier(0.34,1.3,0.64,1), opacity 0.3s ease;
        }
        .soc-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(45deg,rgba(255,255,255,0.02) 0%,rgba(255,255,255,0.02) 40%,rgba(255,255,255,0.45) 50%,rgba(255,255,255,0.02) 60%,rgba(255,255,255,0.02) 100%);

            mask-composite: exclude;
            pointer-events: none;
            z-index: 3;
            animation: shimmer 14s cubic-bezier(0.25,1,0.5,1) infinite;

        .soc-btn:nth-child(1)::before { animation-delay: -1s; }
        .soc-btn:nth-child(2)::before { animation-delay: -4s; }
        .soc-btn:nth-child(3)::before { animation-delay: -7s; }
        .soc-btn:nth-child(4)::before { animation-delay: -10s; }
        .soc-btn:nth-child(5)::before { animation-delay: -13s; }

        .social-row.visible .soc-btn { transform: scaleX(1); opacity: 1; }
        .social-row.visible .soc-btn:nth-child(3) { transition-delay: 0s; }
        .social-row.visible .soc-btn:nth-child(2) { transition-delay: 0.07s; }
        .social-row.visible .soc-btn:nth-child(4) { transition-delay: 0.07s; }
        .social-row.visible .soc-btn:nth-child(1) { transition-delay: 0.14s; }
        .social-row.visible .soc-btn:nth-child(5) { transition-delay: 0.14s; }

        .soc-btn svg {

        }
        .soc-btn:hover svg { color: rgba(255,255,255,1); transform: scale(1.12); }
        .soc-btn:active { filter: brightness(1.3); }
    </style>

<!-- ===== PANORAMA (Three.js) ===== -->
<script>
(function () {
    const canvas   = document.getElementById('panoramaCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 0.001);

    const geometry = new THREE.SphereGeometry(500, 60, 40);
    geometry.scale(-1, 1, 1);

    const texture = new THREE.TextureLoader().load(
        'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/main/Lite2SeamlessHDRI.webp'
    );
    texture.colorSpace = THREE.SRGBColorSpace;

    const material = new THREE.MeshBasicMaterial({ map: texture });
    scene.add(new THREE.Mesh(geometry, material));

    const LERP = 0.08;

    // Текущие углы камеры (радианы)
    let yaw   = 0;   // горизонталь
    let pitch = 0;   // вертикаль
    let targetYaw   = 0;
    let targetPitch = 0;

    const MAX_PITCH = 0.5;

    /* ─── МЫШЬ (десктоп) ─── */
    let gyroActive = false;
    let lastMouseX = null;
    let lastMouseY = null;

    document.addEventListener('mousemove', (e) => {
        if (gyroActive) return;
        if (lastMouseX === null) { lastMouseX = e.clientX; lastMouseY = e.clientY; return; }

        const dx = e.clientX - lastMouseX;
        const dy = e.clientY - lastMouseY;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;

        targetYaw   -= dx * 0.003;
        targetPitch -= dy * 0.002;
        targetPitch  = Math.max(-MAX_PITCH, Math.min(MAX_PITCH, targetPitch));
    });

    /* ─── ГИРОСКОП (мобильный) ─── */
    // Используем DeviceMotionEvent + интегрируем угловую скорость —
    // это даёт плавное «крути телефон → крутится картинка» как на Kuula

    let lastTime = null;

    function onMotion(e) {
        gyroActive = true;

        const rate = e.rotationRate;
        if (!rate) return;

        const now = e.timeStamp || performance.now();
        if (lastTime === null) { lastTime = now; return; }

        const dt = (now - lastTime) / 1000; // секунды
        lastTime = now;

        // rotationRate.alpha — вокруг Z (портрет: поворот по горизонту)
        // rotationRate.beta  — вокруг X (наклон вперёд/назад → pitch)
        // rotationRate.gamma — вокруг Y (наклон влево/вправо → доп. yaw в ландшафте)

        // Определяем ориентацию экрана
        const orient = (screen.orientation && screen.orientation.angle) ||
                       window.orientation || 0;

        let dYaw, dPitch;

        if (Math.abs(orient) === 90 || Math.abs(orient) === 270) {
            // Ландшафт
            dYaw   = rate.beta  * dt * (orient > 0 ? -1 : 1);
            dPitch = rate.gamma * dt * -0.5;
        } else {
            // Портрет (основной режим)
            dYaw   = -rate.alpha * dt;   // alpha — вращение вокруг оси Z (как компас)
            dPitch = -rate.beta  * dt * 0.5;
        }

        targetYaw   += dYaw   * (Math.PI / 180);
        targetPitch += dPitch * (Math.PI / 180);
        targetPitch  = Math.max(-MAX_PITCH, Math.min(MAX_PITCH, targetPitch));
    }

    function requestGyro() {
        if (typeof DeviceMotionEvent !== 'undefined' &&
            typeof DeviceMotionEvent.requestPermission === 'function') {
            // iOS 13+
            DeviceMotionEvent.requestPermission()
                .then(res => {
                    if (res === 'granted')
                        window.addEventListener('devicemotion', onMotion, true);
                })
                .catch(() => {});
        } else {
            window.addEventListener('devicemotion', onMotion, true);
        }
    }

    // На iOS нужен жест пользователя — запрашиваем при первом касании
    document.addEventListener('touchstart', function ask() {
        requestGyro();
        document.removeEventListener('touchstart', ask);
    }, { once: true });

    // Android — можно сразу
    if (!/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        requestGyro();
    }

    /* ─── РЕСАЙЗ ─── */
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* ─── РЕНДЕР ─── */
    const euler = new THREE.Euler(0, 0, 0, 'YXZ');

    function animate() {
        requestAnimationFrame(animate);

        // Плавное сглаживание
        yaw   += (targetYaw   - yaw)   * LERP;
        pitch += (targetPitch - pitch) * LERP;

        euler.set(pitch, yaw, 0);
        camera.quaternion.setFromEuler(euler);

        renderer.render(scene, camera);
    }
    animate();
})();
</script>

<!-- ===== ОСНОВНАЯ ЛОГИКА ===== -->
<script>
document.addEventListener("DOMContentLoaded", () => {

    const tone = 'rgba(20, 15, 25, 0.13)';
    document.querySelectorAll('.glass').forEach(el => el.style.background = tone);

    const card           = document.getElementById('main-card');
    const listView       = document.getElementById('listView');
    const detailView     = document.getElementById('detailView');
    const detailName     = document.getElementById('detailName');
    const detailDesc     = document.getElementById('detailDesc');
    const detailDuration = document.getElementById('detailDuration');
    const detailPrice    = document.getElementById('detailPrice');
    const btnBack        = document.getElementById('btnBack');
    const BLUR_DUR       = 300;

    function blurSwitch(fn) {
        card.classList.add('card-blurring');
        setTimeout(() => { fn(); card.classList.remove('card-blurring'); }, BLUR_DUR);
    }

    document.querySelectorAll('.massage-item').forEach(item => {
        item.addEventListener('click', () => {
            blurSwitch(() => {
                detailName.textContent     = item.dataset.name;
                detailDesc.textContent     = item.dataset.desc;
                detailDuration.textContent = item.dataset.duration;
                detailPrice.textContent    = item.dataset.price;
                listView.classList.add('hidden');
                detailView.classList.remove('hidden');
            });
        });
    });

    btnBack.addEventListener('click', () => {
        blurSwitch(() => {
            detailView.classList.add('hidden');
            listView.classList.remove('hidden');
        });
    });

    // ===== КНОПКИ =====
    const btnMain   = document.getElementById('btnMain');
    const socialRow = document.getElementById('socialRow');
    let expanded = false;

    btnMain.addEventListener('click', () => {
        expanded = true;
        btnMain.classList.add('collapsed');
        socialRow.classList.add('visible');
    });

    document.addEventListener('click', (e) => {
        if (expanded && !e.target.closest('.contacts-zone')) {
            expanded = false;
            socialRow.classList.remove('visible');
            setTimeout(() => btnMain.classList.remove('collapsed'), 150);
        }
    });

    // ===== OIL CANVAS =====
    function initOilCanvas(canvas) {
        const parent = canvas.parentElement;
        canvas.width  = parent.offsetWidth  * 2;
        canvas.height = parent.offsetHeight * 2;
        canvas.style.width  = '100%';
        canvas.style.height = '100%';
        canvas.style.filter = 'blur(22px)';
        canvas.style.transform = 'scale(1.2)';

        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;

        function makeBlob(cx, cy, baseR, jitter, points) {
            const pts = [];
            for (let i = 0; i < points; i++) {
                const angle = (i / points) * Math.PI * 2 + (Math.random() - 0.5) * 0.7;
                const r = baseR * (0.5 + Math.random() * 0.9) + (Math.random() - 0.5) * jitter;
                pts.push({ x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r });
            }
            return pts;
        }

        function drawSmooth(ctx, pts) {
            const n = pts.length;
            ctx.beginPath();
            for (let i = 0; i < n; i++) {
                const p0 = pts[(i - 1 + n) % n];
                const p1 = pts[i];
                const p2 = pts[(i + 1) % n];
                const p3 = pts[(i + 2) % n];
                if (i === 0) ctx.moveTo(p1.x, p1.y);
                const cp1x = p1.x + (p2.x - p0.x) / 5;
                const cp1y = p1.y + (p2.y - p0.y) / 5;
                const cp2x = p2.x - (p3.x - p1.x) / 5;
                const cp2y = p2.y - (p3.y - p1.y) / 5;
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
            }
            ctx.closePath();
        }

        const blobs = Array.from({ length: 4 }, (_, i) => {
            const minR   = Math.min(W, H);
            const points = 8 + Math.floor(Math.random() * 8);
            const baseR  = minR * (0.25 + Math.random() * 0.35);
            const cx     = W * (0.1 + Math.random() * 0.8);
            const cy     = H * (0.1 + Math.random() * 0.8);
            return {
                cx, cy, baseR,
                jitter: minR * (0.15 + Math.random() * 0.2),
                points,
                hue: (i / 4) * 360 + Math.random() * 60,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.3,
                vh: 0.05 + Math.random() * 0.08,
                pts: null, ptV: null,
            };
        });

        blobs.forEach(b => {
            b.pts = makeBlob(b.cx, b.cy, b.baseR, b.jitter, b.points);
            b.ptV = b.pts.map(() => ({ x: (Math.random() - 0.5) * 0.5, y: (Math.random() - 0.5) * 0.5 }));
        });

        function draw() {
            ctx.clearRect(0, 0, W, H);
            blobs.forEach(b => {
                b.cx += b.vx; b.cy += b.vy;
                if (b.cx < -b.baseR)    b.vx =  Math.abs(b.vx);
                if (b.cx > W + b.baseR) b.vx = -Math.abs(b.vx);
                if (b.cy < -b.baseR)    b.vy =  Math.abs(b.vy);
                if (b.cy > H + b.baseR) b.vy = -Math.abs(b.vy);

                b.pts.forEach((p, i) => {
                    p.x += b.ptV[i].x; p.y += b.ptV[i].y;
                    const dx   = b.cx - p.x, dy = b.cy - p.y;
                    const dist = Math.hypot(dx, dy) || 1;
                    const pull = (dist - b.baseR) * 0.003;
                    b.ptV[i].x += (dx / dist) * pull + (Math.random() - 0.5) * 0.06;
                    b.ptV[i].y += (dy / dist) * pull + (Math.random() - 0.5) * 0.06;
                    b.ptV[i].x *= 0.96; b.ptV[i].y *= 0.96;
                });

                b.hue = (b.hue + b.vh) % 360;
                const grad = ctx.createRadialGradient(b.cx, b.cy, 0, b.cx, b.cy, b.baseR * 1.1);
                grad.addColorStop(0,    `hsla(${b.hue}, 80%, 65%, 0.22)`);
                grad.addColorStop(0.5,  `hsla(${(b.hue + 80) % 360}, 80%, 60%, 0.14)`);
                grad.addColorStop(0.85, `hsla(${(b.hue + 160) % 360}, 70%, 55%, 0.06)`);
                grad.addColorStop(1,    `hsla(${b.hue}, 60%, 45%, 0)`);

                ctx.globalCompositeOperation = 'screen';
                drawSmooth(ctx, b.pts);
                ctx.fillStyle = grad;
                ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        draw();
    }

    requestAnimationFrame(() => {
        document.querySelectorAll('.oil-canvas').forEach(c => initOilCanvas(c));
    });

    // ===== PARALLAX UI (мышь / гироскоп) =====
    // Параллакс только для UI-элементов (не для панорамы — она управляется Three.js)
    const MAX_SHIFT = 18;
    const LERP_UI   = 0.06;

    let targetX = 0, targetY = 0;
    let currentX = 0, currentY = 0;
    let gyroActive = false;

    function applyParallax() {
        currentX += (targetX - currentX) * LERP_UI;
        currentY += (targetY - currentY) * LERP_UI;

        document.querySelector('.header').style.transform =
            `translateX(${-currentX * 0.15}px) translateY(${-currentY * 0.15}px)`;
        document.querySelector('.container').style.transform =
            `translateX(${-currentX * 0.08}px) translateY(${-currentY * 0.08}px)`;

        requestAnimationFrame(applyParallax);
    }
    applyParallax();

    window.addEventListener('deviceorientation', (e) => {
        gyroActive = true;
        const beta  = Math.max(-45, Math.min(45, e.beta  || 0));
        const gamma = Math.max(-45, Math.min(45, e.gamma || 0));
        targetX = (gamma / 45) * MAX_SHIFT;
        targetY = (beta  / 45) * MAX_SHIFT * 0.6;
    }, true);

    document.addEventListener('mousemove', (e) => {
        if (gyroActive) return;
        const cx = window.innerWidth  / 2;
        const cy = window.innerHeight / 2;
        targetX = ((e.clientX - cx) / cx) * MAX_SHIFT;
        targetY = ((e.clientY - cy) / cy) * MAX_SHIFT * 0.6;
    });

    document.addEventListener('mouseleave', () => {
        if (gyroActive) return;
        targetX = 0; targetY = 0;
    });

});
</script>

</body>
</html>
