  { name:'Аромамассаж',          desc:'Мягкие техники с натуральными эфирными маслами. Успокаивает нервную систему и наполняет тело ощущением лёгкости.',         duration:'75 или 90 мин', price:'700 / 900 грн'  },
  { name:'Массаж спины и шеи',   desc:'Снимает головную боль, напряжение от сидячей работы и скованность в плечовом поясе. Результат с первого сеанса.',         duration:'30 или 45 мин', price:'400 / 550 грн'  },
  { name:'Антицеллюлитный',      desc:'Лимфодренаж и улучшение микроциркуляции. Кожа становится упругей, контуры — чётче. Курс от 8 сеансов.',                   duration:'45 или 60 мин', price:'650 / 850 грн'  },

var SOC_ICONS = [

  { href:'https://t.me/username',          src:'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/telegram.svg' },

/* ── Renderer ── */
var canvas = document.getElementById('gc');
var W = window.innerWidth, H = window.innerHeight;

var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.autoClear = false;

var skyScene  = new THREE.Scene();
var mainScene = new THREE.Scene();

var camera    = new THREE.PerspectiveCamera(75, W/H, 0.1, 500);
var skyCamera = new THREE.PerspectiveCamera(75, W/H, 1, 1000);
camera.position.set(0, 1.6, 0);

var loader = new THREE.TextureLoader();
loader.crossOrigin = 'anonymous';

/* ── Sky ── */
var skyGeo = new THREE.SphereGeometry(500, 64, 32);
skyGeo.scale(-1, 1, 1);
var skyMat = new THREE.ShaderMaterial({
  uniforms:{top:{value:new THREE.Color(0x2a6fbe)},bot:{value:new THREE.Color(0xb0cfe8)}},
  vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top,bot;varying vec3 vP;void main(){float h=clamp(normalize(vP).y*2.,0.,1.);gl_FragColor=vec4(mix(bot,top,h),1.);}'
});
var skyMesh = new THREE.Mesh(skyGeo, skyMat);
skyScene.add(skyMesh);

loader.load(
  'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/main/garden.webp',
  function(tex){
    tex.encoding = THREE.sRGBEncoding;
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    skyMesh.material = new THREE.MeshBasicMaterial({map:tex, side:THREE.FrontSide});

);

/* ── Cards ── */
var CARD_RADIUS = 5.5;
var CARD_Y      = 1.6;
var CARD_W      = 2.2;
var CARD_H      = 3.2;
var TW = 560, TH = 800;

var cardExpanded = new Array(CARDS.length).fill(false);
/* cardAnim[i] = float 0..1, анимация разворота пилюли */
var cardAnim = new Array(CARDS.length).fill(0);

/* ── Shimmer helpers ── */
// Returns a point at arc-length fraction t around a rounded-rect perimeter
// rect: {x,y,w,h,r}  t: 0..1
function shimmerPoint(rect, t) {
  var x = rect.x, y = rect.y, w = rect.w, h = rect.h, r = rect.r;
  // Segment lengths
  var straight_h = w - 2*r;
  var straight_v = h - 2*r;
  var arc_len    = Math.PI * 0.5 * r;
  var total = 2*(straight_h + straight_v) + 4*arc_len;
  var d = t * total;

  // Walk: top-left corner (going right along top edge, clockwise)
  var segments = [
    { len: arc_len,    type:'arc', cx: x+r,   cy: y+r,   a0: Math.PI,     da: -Math.PI/2 },
    { len: straight_h, type:'line', dx:1, dy:0, sx: x+r,     sy: y         },
    { len: arc_len,    type:'arc', cx: x+w-r, cy: y+r,   a0: -Math.PI/2, da: -Math.PI/2 },
    { len: straight_v, type:'line', dx:0, dy:1, sx: x+w,     sy: y+r       },
    { len: arc_len,    type:'arc', cx: x+w-r, cy: y+h-r, a0: 0,           da: -Math.PI/2 },
    { len: straight_h, type:'line', dx:-1,dy:0, sx: x+w-r,   sy: y+h       },
    { len: arc_len,    type:'arc', cx: x+r,   cy: y+h-r, a0: Math.PI/2,  da: -Math.PI/2 },
    { len: straight_v, type:'line', dx:0, dy:-1,sx: x,        sy: y+h-r    },
  ];

  for (var i = 0; i < segments.length; i++) {
    var seg = segments[i];
    if (d <= seg.len) {
      var frac = d / seg.len;
      if (seg.type === 'arc') {
        var angle = seg.a0 + frac * seg.da;
        return { px: seg.cx + Math.cos(angle)*r, py: seg.cy + Math.sin(angle)*r };
      } else {
        return { px: seg.sx + frac*seg.len*seg.dx, py: seg.sy + frac*seg.len*seg.dy };
      }
    }
    d -= seg.len;
  }
  return { px: x, py: y };
}

var socImages = SOC_ICONS.map(function(s){
  var img = new Image(); img.crossOrigin = 'anonymous'; img.src = s.src; return img;
});

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function wrapText(ctx,text,x,y,maxW,lineH){
  var words=text.split(' '), line='';
  for(var i=0;i<words.length;i++){
    var test=line+words[i]+' ';
    if(ctx.measureText(test).width>maxW&&i>0){ ctx.fillText(line.trim(),x,y); line=words[i]+' '; y+=lineH; }
    else line=test;
  }
  ctx.fillText(line.trim(),x,y);
}

function drawWhiteIcon(ctx, img, x, y, size){
  var off = document.createElement('canvas'); off.width=size; off.height=size;
  var oc  = off.getContext('2d');
  oc.fillStyle = '#ffffff'; oc.fillRect(0,0,size,size);
  oc.globalCompositeOperation = 'destination-in';
  oc.drawImage(img, 0, 0, size, size);
  ctx.drawImage(off, x, y);
}

function drawCard(cc, data, anim, shimmerT){
  shimmerT = shimmerT || 0;
  anim = anim === undefined ? 0 : anim;
  var ctx = cc.getContext('2d');
  ctx.clearRect(0,0,TW,TH);

  /* ── фон: тёмное затемнение + лёгкий градиент ── */
  roundRect(ctx,0,0,TW,TH,60);
  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  ctx.fill();

  /* чуть тёплый оттенок снизу */
  var vgn = ctx.createLinearGradient(0,0,0,TH);
  vgn.addColorStop(0, 'rgba(30,20,10,0.00)');
  vgn.addColorStop(1, 'rgba(10,5,0,0.25)');
  roundRect(ctx,0,0,TW,TH,60);
  ctx.fillStyle = vgn; ctx.fill();

  /* блик сверху */
  var shine = ctx.createLinearGradient(0,0,0,TH*0.28);
  shine.addColorStop(0, 'rgba(255,255,255,0.10)');
  shine.addColorStop(1, 'rgba(255,255,255,0.00)');
  roundRect(ctx,0,0,TW,TH,60);
  ctx.fillStyle = shine; ctx.fill();

  /* рамка + шиммер */
  // Базовая рамка
  ctx.strokeStyle = 'rgba(255,255,255,0.20)'; ctx.lineWidth = 3;
  roundRect(ctx,2,2,TW-4,TH-4,58); ctx.stroke();

  // Шиммер-полоска бежит по контуру
  var shimRect = {x:2, y:2, w:TW-4, h:TH-4, r:58};
  var gLen = 0.18; // ширина блика как доля периметра
  var t0 = shimmerT % 1;
  // Точки начала и конца блика
  var pt1 = shimmerPoint(shimRect, (t0 - gLen/2 + 1) % 1);
  var pt2 = shimmerPoint(shimRect, (t0 + gLen/2) % 1);
  // Линейный градиент вдоль направления движения
  var grd = ctx.createLinearGradient(pt1.px, pt1.py, pt2.px, pt2.py);
  grd.addColorStop(0,   'rgba(255,255,255,0.00)');
  grd.addColorStop(0.3, 'rgba(255,255,255,0.35)');
  grd.addColorStop(0.5, 'rgba(255,255,255,0.80)');
  grd.addColorStop(0.7, 'rgba(255,255,255,0.35)');
  grd.addColorStop(1,   'rgba(255,255,255,0.00)');
  ctx.save();
  ctx.strokeStyle = grd; ctx.lineWidth = 5;
  roundRect(ctx,2,2,TW-4,TH-4,58); ctx.stroke();
  ctx.restore();

  /* заголовок */
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 46px -apple-system,BlinkMacSystemFont,Helvetica,sans-serif';
  ctx.textAlign = 'left';
  ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 10;
  wrapText(ctx, data.name, 44, 86, TW-88, 56);
  ctx.shadowBlur = 0;

  /* разделитель */
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(44,130); ctx.lineTo(TW-44,130); ctx.stroke();

  /* описание */
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = '28px -apple-system,BlinkMacSystemFont,Helvetica,sans-serif';
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 6;
  wrapText(ctx, data.desc, 44, 180, TW-88, 40);
  ctx.shadowBlur = 0;

  /* инфо: длительность · цена */
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = '24px -apple-system,BlinkMacSystemFont,Helvetica,sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(data.duration + '  ·  ' + data.price, TW/2, TH-172);

  /* нижняя пилюля — кнопка «Записаться» */
  var pillY = TH-148, pillH = 110;
  var pillX = 36, pillW = TW-72;

  /* фон пилюли */
  roundRect(ctx, pillX, pillY, pillW, pillH, 28);
  ctx.fillStyle = 'rgba(255,255,255,0.10)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.2; ctx.stroke();

  // easeOutBack для пружинки при появлении иконок
  function easeOutBack(t) {
    var c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  // Текст кнопки — исчезает при anim > 0
  var textAlpha = Math.max(0, 1 - anim * 3);
  if(textAlpha > 0){
    ctx.save();
    ctx.globalAlpha = textAlpha * 0.92;
    ctx.fillStyle = '#ffffff';
    ctx.font = '26px -apple-system,BlinkMacSystemFont,Helvetica,sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 5;
    ctx.fillText('ЗАПИСАТЬСЯ НА СЕАНС', TW/2, pillY + 66);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // Иконки — появляются с задержкой, вылетая из центра
  if(anim > 0){
    var iconSize = 44;
    var totalW = pillW, step = totalW / 5;
    // Каждая иконка имеет свою задержку от центра (индекс 2 — центральная)
    var order = [2, 1, 3, 0, 4]; // порядок появления: центр → наружу
    SOC_ICONS.forEach(function(soc, idx){
      // Задержка по порядку появления
      var rank = order.indexOf(idx);
      var delay = rank * 0.12; // 0, 0.12, 0.24, 0.36, 0.48
      var localT = Math.max(0, Math.min(1, (anim - delay) / (1 - delay * 0.5)));
      if(localT <= 0) return;

      var spring = easeOutBack(localT);

      // Финальная позиция иконки
      var finalX = pillX + step * idx + step / 2 - iconSize / 2;
      var finalY = pillY + (pillH - iconSize) / 2;
      // Стартовая позиция — центр пилюли
      var startX = pillX + pillW / 2 - iconSize / 2;
      var ix = startX + (finalX - startX) * spring;
      var iy = finalY;

      // Разделитель между ячейками
      if(idx > 0 && localT > 0.5){
        var divAlpha = Math.min(1, (localT - 0.5) * 4) * 0.12;
        ctx.save();
        ctx.globalAlpha = divAlpha;
        ctx.strokeStyle = 'rgba(255,255,255,1)'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(pillX + step * idx, pillY + 14);
        ctx.lineTo(pillX + step * idx, pillY + pillH - 14);
        ctx.stroke();
        ctx.restore();
      }

      ctx.save();
      ctx.globalAlpha = Math.min(1, localT * 2) * 0.90;
      // Масштабируем иконку вокруг её центра
      var cx2 = ix + iconSize / 2, cy2 = iy + iconSize / 2;
      var sc = 0.5 + spring * 0.5;
      ctx.translate(cx2, cy2);
      ctx.scale(sc, sc);
      ctx.translate(-cx2, -cy2);
      if(socImages[idx].complete && socImages[idx].naturalWidth > 0){
        drawWhiteIcon(ctx, socImages[idx], ix, iy, iconSize);
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.beginPath(); ctx.arc(ix + iconSize/2, iy + iconSize/2, iconSize/2, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    });
  }
}

var cardMeshes = [];
CARDS.forEach(function(data, i){
  var angle = (i / CARDS.length) * Math.PI * 2;
  var x = Math.sin(angle) * CARD_RADIUS;
  var z = -Math.cos(angle) * CARD_RADIUS;
  var cc = document.createElement('canvas');
  cc.width = TW; cc.height = TH;
  drawCard(cc, data, false);
  var tex = new THREE.CanvasTexture(cc);
  tex.encoding = THREE.sRGBEncoding;
  var geo = new THREE.PlaneGeometry(CARD_W, CARD_H);
  var mat = new THREE.MeshBasicMaterial({map:tex, transparent:true, side:THREE.DoubleSide, depthWrite:false});
  var mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, CARD_Y, z);
  mesh.lookAt(0, CARD_Y, 0);
  mainScene.add(mesh);
  cardMeshes.push({mesh:mesh, angle:angle, tex:tex, cc:cc, data:data});
});

function redrawCard(i, shimmerT){
  drawCard(cardMeshes[i].cc, cardMeshes[i].data, cardAnim[i], shimmerT || 0);
  cardMeshes[i].tex.needsUpdate = true;
}
socImages.forEach(function(img){
  img.onload = function(){ cardMeshes.forEach(function(_,i){ redrawCard(i, 0); }); };
});

/* ── Глубина / прозрачность ── */
function updateDepth(){
  var dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  cardMeshes.forEach(function(c){
    var cd  = new THREE.Vector3(Math.sin(c.angle), 0, -Math.cos(c.angle));
    var dot = Math.max(-1, Math.min(1, dir.dot(cd)));
    var t   = (dot+1)/2;
    c.mesh.material.opacity = 0.35 + t*0.65;
    c.mesh.scale.setScalar(0.80 + t*0.20);
  });
}

/* ── Raycaster ── */
var raycaster = new THREE.Raycaster();
var pointer   = new THREE.Vector2();
var pdx=0, pdy=0;
var skipNextTouch = false;

canvas.addEventListener('mousedown', function(e){ pdx=e.clientX; pdy=e.clientY; });
canvas.addEventListener('mouseup', function(e){
  if(Math.abs(e.clientX-pdx)>8||Math.abs(e.clientY-pdy)>8) return;
  handleClick(e.clientX, e.clientY, false);
});
canvas.addEventListener('touchstart', function(e){
  if(e.touches.length===1){ pdx=e.touches[0].clientX; pdy=e.touches[0].clientY; }
},{passive:true});
canvas.addEventListener('touchend', function(e){
  if(skipNextTouch){ skipNextTouch=false; return; }
  if(e.changedTouches.length!==1) return;
  var t=e.changedTouches[0];
  if(Math.abs(t.clientX-pdx)>8||Math.abs(t.clientY-pdy)>8) return;
  handleClick(t.clientX, t.clientY, true);
},{passive:true});

function handleClick(cx, cy, isTouch){
  var rect = canvas.getBoundingClientRect();
  pointer.x =  ((cx-rect.left)/rect.width )*2-1;
  pointer.y = -((cy-rect.top) /rect.height)*2+1;
  raycaster.setFromCamera(pointer, camera);
  var hits = raycaster.intersectObjects(cardMeshes.map(function(c){return c.mesh;}));
  if(!hits.length) return;
  var idx = cardMeshes.findIndex(function(c){return c.mesh===hits[0].object;});
  if(idx<0) return;
  var uv = hits[0].uv;
  // Пилюля занимает нижние ~18.5% UV (pillY = TH-148, TH=800 => 148/800 ≈ 0.185)
  var inPill = uv && uv.y < 0.185;
  var isOpen = cardExpanded[idx]; // true когда анимация идёт в сторону 1
  if(inPill){
    if(isOpen){
      // Клик по одной из 5 иконок — только если анимация завершена (~1)
      if(cardAnim[idx] > 0.85){
        var si = Math.floor(uv.x * 5);
        si = Math.max(0, Math.min(4, si));
        if(isTouch) skipNextTouch = true;
        window.open(SOC_ICONS[si].href, '_blank');
      }
    } else {
      // Открыть
      cardExpanded[idx] = true;
    }
  } else {
    // Клик по телу карточки — закрыть
    if(isOpen){
      cardExpanded[idx] = false;
    }
  }
}

/* ── Resize ── */
window.addEventListener('resize', function(){
  W=window.innerWidth; H=window.innerHeight;
  camera.aspect = skyCamera.aspect = W/H;
  camera.updateProjectionMatrix();
  skyCamera.updateProjectionMatrix();
  renderer.setSize(W,H);
});

/* ── Controls ── */
var qT=new THREE.Quaternion(), qC=new THREE.Quaternion();
var _e=new THREE.Euler(), _q1=new THREE.Quaternion(), _q2=new THREE.Quaternion();
var gyroOn=false, SLERP=0.07;
var dy=0, dp=0.05, dn=false, lx=null, ly=null;
_e.set(dp,dy,0,'YXZ'); qT.setFromEuler(_e);

function screenAngle(){ return (window.screen&&window.screen.orientation)?(window.screen.orientation.angle||0):(window.orientation||0); }
function onOri(e){
  if(e.alpha===null) return; gyroOn=true;
  _e.set(THREE.MathUtils.degToRad(e.beta),THREE.MathUtils.degToRad(e.alpha),-THREE.MathUtils.degToRad(e.gamma),'YXZ');
  qT.setFromEuler(_e);
  _q1.setFromAxisAngle(new THREE.Vector3(1,0,0),-Math.PI/2); qT.multiply(_q1);
  _q2.setFromAxisAngle(new THREE.Vector3(0,0,1),THREE.MathUtils.degToRad(screenAngle())); qT.multiply(_q2);
}
function startGyro(){
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(function(s){if(s==='granted')window.addEventListener('deviceorientation',onOri,true);}).catch(function(){});
  } else { window.addEventListener('deviceorientation',onOri,true); }
}
var permDone=false;
document.addEventListener('touchstart',function(){if(!permDone){permDone=true;startGyro();}},{once:true});
startGyro();

canvas.addEventListener('mousedown',function(e){dn=true;lx=e.clientX;ly=e.clientY;});
window.addEventListener('mouseup',function(){dn=false;});
window.addEventListener('mousemove',function(e){
  if(!dn||gyroOn) return;
  dy-=(e.clientX-lx)*0.003; dp-=(e.clientY-ly)*0.003;
  dp=Math.max(-0.5,Math.min(1.4,dp)); lx=e.clientX; ly=e.clientY;
  _e.set(dp,dy,0,'YXZ'); qT.setFromEuler(_e);
});
var tx=null, ty=null;
canvas.addEventListener('touchstart',function(e){if(!gyroOn){var t=e.touches[0];tx=t.clientX;ty=t.clientY;}},{passive:true});
canvas.addEventListener('touchmove',function(e){
  if(gyroOn) return; var t=e.touches[0];
  if(tx!==null){dy-=(t.clientX-tx)*0.004;dp-=(t.clientY-ty)*0.004;dp=Math.max(-0.5,Math.min(1.4,dp));_e.set(dp,dy,0,'YXZ');qT.setFromEuler(_e);}
  tx=t.clientX; ty=t.clientY;
},{passive:true});

setTimeout(function(){var h=document.getElementById('hint');if(h)h.style.opacity='0';},3500);

/* ── Render loop ── */
var animId=null;
var shimmerClock = 0;
var SHIMMER_SPEED = 0.025; // оборотов в секунду
var PILL_SPEED    = 3.5;   // скорость анимации пилюли (1/сек)
var lastTime = 0;
function animate(now){
  animId=requestAnimationFrame(animate);
  var dt = lastTime ? Math.min((now - lastTime) / 1000, 0.1) : 0;
  lastTime = now;
  shimmerClock += dt * SHIMMER_SPEED;
  qC.slerp(qT, SLERP);
  camera.quaternion.copy(qC);
  skyCamera.quaternion.copy(qC);
  updateDepth();
  updateButterflies(dt);
  // Продвигаем анимацию пилюли и перерисовываем карточки
  cardMeshes.forEach(function(c, i){
    var target = cardExpanded[i] ? 1 : 0;
    var prev   = cardAnim[i];
    // Плавное приближение к target
    cardAnim[i] += (target - cardAnim[i]) * Math.min(1, dt * PILL_SPEED);
    if(Math.abs(cardAnim[i] - target) < 0.001) cardAnim[i] = target;
    var t = (shimmerClock + i / CARDS.length) % 1;
    drawCard(c.cc, c.data, cardAnim[i], t);
    c.tex.needsUpdate = true;
  });
  renderer.clear();
  renderer.render(skyScene, skyCamera);
  renderer.clearDepth();
  renderer.render(mainScene, camera);
}
/* ── Butterflies ── */
var butterflies = [];
var butterflyMixers = [];
var BUTTERFLY_COUNT = 6;

// Границы зоны полёта (вокруг карточек, на уровне глаз)
var FLY_RANGE = { xz: 7, yMin: 1.0, yMax: 3.8 };

function randFlyTarget() {
  var angle = Math.random() * Math.PI * 2;
  // Минимальная дистанция 3.5 — не ближе чем карточки (CARD_RADIUS = 5.5)
  var dist  = 3.5 + Math.random() * 4.5;
  return new THREE.Vector3(
    Math.sin(angle) * dist,
    FLY_RANGE.yMin + Math.random() * (FLY_RANGE.yMax - FLY_RANGE.yMin),
    Math.cos(angle) * dist
  );
}

var BUTTERFLY_BASE = 'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/main/butterfly/';

// Кастомный менеджер: все относительные пути резолвим через BUTTERFLY_BASE
var butterflyManager = new THREE.LoadingManager();
butterflyManager.setURLModifier(function(url) {
  if(url.startsWith('http') || url.startsWith('blob') || url.startsWith('data')) return url;
  var clean = url.replace(/^\.\//, '').replace(/^\//, '');
  return BUTTERFLY_BASE + clean;
});

/* ── Процедурные текстуры крыльев ── */
// Палитра: тропические цвета
var BUTTERFLY_PALETTES = [
  { base:'#1a6fce', accent:'#7fd4ff', spot:'#ffffff' }, // голубая
  { base:'#d4420a', accent:'#ffb347', spot:'#fff0a0' }, // оранжевая
  { base:'#2a9a4a', accent:'#90ee90', spot:'#ffffff' }, // зелёная
  { base:'#8b1a8b', accent:'#da70d6', spot:'#ffe0ff' }, // фиолетовая
  { base:'#c8a000', accent:'#ffe066', spot:'#ffffff' }, // жёлтая
  { base:'#1a8080', accent:'#40e0d0', spot:'#e0ffff' }, // бирюзовая
];

function makeButterflyTexture(palette) {
  var sz = 256;
  var cv = document.createElement('canvas');
  cv.width = sz; cv.height = sz;
  var ctx = cv.getContext('2d');

  // Фон прозрачный
  ctx.clearRect(0, 0, sz, sz);

  // Верхнее крыло (левая половина текстуры — UV-пространство модели)
  // Рисуем симметричную бабочку на всём холсте
  function wing(cx, cy, rx, ry, rot) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    // Основа крыла
    var grad = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    grad.addColorStop(0,   palette.accent);
    grad.addColorStop(0.5, palette.base);
    grad.addColorStop(1,   'rgba(0,0,0,0.7)');
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    // Пятна
    ctx.fillStyle = palette.spot;
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.arc(rx * 0.35, ry * 0.2, rx * 0.1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(rx * 0.55, -ry * 0.1, rx * 0.07, 0, Math.PI*2); ctx.fill();
    // Край крыла
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.stroke();
    // Прожилки
    ctx.globalAlpha = 0.25;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    for(var i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(rx * Math.cos(i * 0.3), ry * Math.sin(i * 0.3 + 0.5));
      ctx.stroke();
    }
    ctx.restore();
  }

  ctx.globalAlpha = 1;
  var hw = sz / 2, hh = sz / 2;
  // 4 крыла: 2 верхних (крупнее), 2 нижних (меньше)
  wing(hw - sz*0.18, hh - sz*0.05, sz*0.28, sz*0.22, -0.4);  // верх-лево
  wing(hw + sz*0.18, hh - sz*0.05, sz*0.28, sz*0.22,  0.4);  // верх-право
  wing(hw - sz*0.14, hh + sz*0.12, sz*0.18, sz*0.15, -0.2);  // низ-лево
  wing(hw + sz*0.14, hh + sz*0.12, sz*0.18, sz*0.15,  0.2);  // низ-право

  // Тельце
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.ellipse(hw, hh, sz*0.025, sz*0.18, 0, 0, Math.PI*2);
  ctx.fill();

  var tex = new THREE.CanvasTexture(cv);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

var gltfLoader = new THREE.GLTFLoader(butterflyManager);
gltfLoader.load(
  BUTTERFLY_BASE + 'scene.gltf',
  function(gltf) {
    var BASE_SCALE = 0.36;

    for (var b = 0; b < BUTTERFLY_COUNT; b++) {
      var clone = THREE.SkeletonUtils.clone(gltf.scene);
      var sc = BASE_SCALE * (0.8 + Math.random() * 0.5);
      clone.scale.setScalar(sc);

      // Применяем процедурную текстуру
      var palette = BUTTERFLY_PALETTES[b % BUTTERFLY_PALETTES.length];
      var bTex = makeButterflyTexture(palette);
      clone.traverse(function(node) {
        if(node.isMesh && node.material) {
          node.material = node.material.clone();
          node.material.map = bTex;
          node.material.needsUpdate = true;
        }
      });

      clone.position.copy(randFlyTarget());
      mainScene.add(clone);

      var mixer = null;
      if(gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(clone);
        var action = mixer.clipAction(gltf.animations[0]);
        // Скорость анимации крыльев ×2 от предыдущего
        action.timeScale = 1.6 + Math.random() * 1.2;
        action.play();
        mixer.update(Math.random() * 2.0);
        butterflyMixers.push(mixer);
      }

      butterflies.push({
        obj:      clone,
        mixer:    mixer,
        target:   randFlyTarget(),
        speed:    0.25 + Math.random() * 0.3,
        wobble:   Math.random() * Math.PI * 2,
        wobbleS:  0.6 + Math.random() * 0.8,
        wobbleA:  0.004 + Math.random() * 0.006,
        qCurrent: new THREE.Quaternion().copy(clone.quaternion),
        qTarget:  new THREE.Quaternion(),
      });
    }
  },
  undefined,
  function(err) { console.warn('Butterfly load error:', err); }
);

var _bUp   = new THREE.Vector3(0, 1, 0);
var _bDir  = new THREE.Vector3();
var _bMtx  = new THREE.Matrix4();

function updateButterflies(dt) {
  butterflies.forEach(function(bf) {
    if(bf.mixer) bf.mixer.update(dt);

    _bDir.subVectors(bf.target, bf.obj.position);
    var dist = _bDir.length();

    if(dist < 0.3) {
      bf.target = randFlyTarget();
      _bDir.subVectors(bf.target, bf.obj.position);
      dist = _bDir.length();
    }

    var step = Math.min(bf.speed * dt, dist);
    _bDir.normalize();
    bf.obj.position.addScaledVector(_bDir, step);

    // Вертикальное покачивание
    bf.wobble += dt * bf.wobbleS;
    bf.obj.position.y += Math.sin(bf.wobble) * bf.wobbleA;
    bf.obj.position.y = Math.max(FLY_RANGE.yMin, Math.min(FLY_RANGE.yMax, bf.obj.position.y));

    // Плавный поворот по направлению движения
    if(dist > 0.1) {
      _bMtx.lookAt(bf.obj.position, bf.target, _bUp);
      bf.qTarget.setFromRotationMatrix(_bMtx);
      bf.qCurrent.slerp(bf.qTarget, Math.min(1, dt * 3));
      bf.obj.quaternion.copy(bf.qCurrent);
    }
  });
}

document.addEventListener('visibilitychange',function(){
  if(document.hidden){cancelAnimationFrame(animId);animId=null;lastTime=0;}
  else if(!animId) requestAnimationFrame(animate);
});
requestAnimationFrame(animate);

})();
</script>
