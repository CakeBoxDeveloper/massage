<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Paradise Garden</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }
  #gc { position:fixed; inset:0; width:100%; height:100%; display:block; }

  #overlay { position:fixed; inset:0; pointer-events:none; z-index:10; }

  .card {
    position: absolute;
    width: 210px;
    border-radius: 20px;
    backdrop-filter: blur(24px) saturate(1.5);
    -webkit-backdrop-filter: blur(24px) saturate(1.5);
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.45);
    box-shadow: 0 4px 32px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.22);
    padding: 20px 18px 16px;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, Helvetica, sans-serif;
    cursor: pointer;
    /* NO transition — обновляем каждый кадр, transition даёт лаг */
    user-select: none; -webkit-user-select: none;
    will-change: transform, opacity;
  }
  .card h2 {
    font-size: 16px; font-weight: 700; line-height: 1.3;
    margin-bottom: 8px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }
  .card .sep { height:1px; background:rgba(255,255,255,0.22); margin-bottom:9px; }
  .card .desc {
    font-size: 12.5px; line-height: 1.5;
    color: rgba(255,255,255,0.88);
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    margin-bottom: 13px;
  }
  .card .pill {
    background: rgba(255,255,255,0.13);
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 11px;
    text-align: center;
    padding: 9px 6px;
    font-size: 12.5px; font-weight: 600;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 1px 4px rgba(0,0,0,0.35);
  }
  .card .soc-row {
    display:flex; justify-content:space-around; align-items:center; padding:4px 0;
  }
  .card .soc-row a {
    display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; pointer-events:auto;
  }
  .card .soc-row img {
    width:26px; height:26px;
    filter: brightness(0) invert(1); opacity:0.92;
  }

  #hint {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    font-size:14px; color:rgba(255,255,255,0.85); pointer-events:none;
    background:rgba(0,0,0,0.3); padding:5px 16px; border-radius:20px;
    transition:opacity 1.2s; font-family:sans-serif; z-index:20;
  }
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="overlay"></div>
<div id="hint">Тяните мышью для поворота</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function(){

var CARDS = [
  { name:'Классический массаж',  desc:'Восстанавливает кровообращение, снимает мышечное напряжение и улучшает общий тонус тела. Идеально после тяжёлой недели.',  duration:'60 или 90 мин', price:'600 / 850 грн'  },
  { name:'Глубокотканный',       desc:'Интенсивное воздействие на глубокие слои мышц. Эффективен при хронических болях и мышечных зажимах после стресса.',       duration:'60 или 90 мин', price:'750 / 1050 грн' },
  { name:'Аромамассаж',          desc:'Мягкие техники с натуральными эфирными маслами. Успокаивает нервную систему и наполняет тело ощущением лёгкости.',         duration:'75 или 90 мин', price:'700 / 900 грн'  },
  { name:'Массаж спины и шеи',   desc:'Снимает головную боль, напряжение от сидячей работы и скованность в плечовом поясе. Результат с первого сеанса.',         duration:'30 или 45 мин', price:'400 / 550 грн'  },
  { name:'Антицеллюлитный',      desc:'Лимфодренаж и улучшение микроциркуляции. Кожа становится упругей, контуры — чётче. Курс от 8 сеансов.',                   duration:'45 или 60 мин', price:'650 / 850 грн'  },
  { name:'Спортивный массаж',    desc:'Восстановление после тренировок, профилактика травм, повышение гибкости и тонуса мышц. До и после нагрузок.',              duration:'60 мин',        price:'700 грн'        },
];

var SOC = [
  { href:'https://threads.net/',           src:'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/hreads.svg'   },
  { href:'https://t.me/username',          src:'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/telegram.svg' },
  { href:'https://instagram.com/username', src:'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/insta.svg'    },
  { href:'https://wa.me/380000000000',     src:'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/wa.svg'       },
  { href:'tel:+380000000000',              src:'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/1ababeedeb1d13277ee3945bd47dfd3bb482dc85/call.svg'     },
];

/* ── Renderer ── */
var canvas = document.getElementById('gc');
var W = window.innerWidth, H = window.innerHeight;

var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.autoClear = false;

var skyScene  = new THREE.Scene();
var camera    = new THREE.PerspectiveCamera(75, W/H, 0.1, 500);
var skyCamera = new THREE.PerspectiveCamera(75, W/H, 1, 1000);
camera.position.set(0, 1.6, 0);

var loader = new THREE.TextureLoader();
loader.crossOrigin = 'anonymous';

/* ── Sky ── */
var skyGeo = new THREE.SphereGeometry(500, 64, 32);
skyGeo.scale(-1, 1, 1);
var skyMat = new THREE.ShaderMaterial({
  uniforms:{top:{value:new THREE.Color(0x2a6fbe)},bot:{value:new THREE.Color(0xb0cfe8)}},
  vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top,bot;varying vec3 vP;void main(){float h=clamp(normalize(vP).y*2.,0.,1.);gl_FragColor=vec4(mix(bot,top,h),1.);}'
});
var skyMesh = new THREE.Mesh(skyGeo, skyMat);
skyScene.add(skyMesh);

loader.load(
  'https://raw.githubusercontent.com/CakeBoxDeveloper/massage/main/%7B__prompt____An_equirectangular_360-degree_202606110114.jpeg',
  function(tex){
    tex.encoding = THREE.sRGBEncoding;
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    skyMesh.material = new THREE.MeshBasicMaterial({map:tex, side:THREE.FrontSide});
  }
);

/* ── HTML Cards ── */
var RADIUS   = 5.5;
var CARD_Y   = 1.6; /* совпадает с camera.position.y — карточки на уровне глаз */
var overlay  = document.getElementById('overlay');
var cardExpanded = new Array(CARDS.length).fill(false);
var cardEls  = [];
var cardPos  = []; /* мировые позиции карточек */

CARDS.forEach(function(data, i){
  var angle = (i / CARDS.length) * Math.PI * 2;
  cardPos.push(new THREE.Vector3(
    Math.sin(angle) * RADIUS,
    CARD_Y,
    -Math.cos(angle) * RADIUS
  ));

  var el = document.createElement('div');
  el.className = 'card';
  el.innerHTML =
    '<h2>' + data.name + '</h2>' +
    '<div class="sep"></div>' +
    '<div class="desc">' + data.desc + '</div>' +
    '<div class="pill" data-pill>' + data.duration + '  ·  ' + data.price + '</div>';

  overlay.appendChild(el);
  cardEls.push(el);

  (function(idx, el, d){
    el.addEventListener('click', function(e){
      e.stopPropagation();
      cardExpanded[idx] = !cardExpanded[idx];
      var pill = el.querySelector('[data-pill]');
      if(cardExpanded[idx]){
        var row = document.createElement('div');
        row.className = 'soc-row';
        SOC.forEach(function(s){
          var a = document.createElement('a');
          a.href = s.href; a.target = '_blank';
          a.addEventListener('click', function(ev){ ev.stopPropagation(); });
          var img = document.createElement('img');
          img.src = s.src;
          a.appendChild(img);
          row.appendChild(a);
        });
        pill.innerHTML = '';
        pill.appendChild(row);
      } else {
        pill.innerHTML = d.duration + '  ·  ' + d.price;
      }
    });
  })(i, el, data);
});

/* закрыть все карточки кликом на канвас */
canvas.addEventListener('click', function(){
  CARDS.forEach(function(d, i){
    if(!cardExpanded[i]) return;
    cardExpanded[i] = false;
    cardEls[i].querySelector('[data-pill]').innerHTML = d.duration + '  ·  ' + d.price;
  });
});

/* ── Проекция 3D → 2D ──
   Важно: camera.updateMatrixWorld() должен быть вызван ПОСЛЕ
   применения нового quaternion, ДО project().               */
var _v = new THREE.Vector3();

function updateCards(){
  /* camera.matrixWorldNeedsUpdate устанавливается при изменении quaternion,
     updateMatrixWorld() вызывается здесь явно чтобы гарантировать свежую матрицу */
  camera.updateMatrixWorld(true);

  var fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);

  for(var i = 0; i < CARDS.length; i++){
    var pos = cardPos[i];

    /* вектор от камеры к карточке */
    var toCard = _v.set(
      pos.x - camera.position.x,
      pos.y - camera.position.y,
      pos.z - camera.position.z
    ).normalize();

    var dot = fwd.dot(toCard); /* 1 = прямо, -1 = сзади */

    if(dot <= 0){
      /* карточка сзади — полностью скрыть */
      cardEls[i].style.visibility = 'hidden';
      cardEls[i].style.pointerEvents = 'none';
      continue;
    }

    /* проекция в NDC */
    var proj = pos.clone();
    proj.project(camera);

    /* NDC → пиксели */
    var sx = ( proj.x * 0.5 + 0.5) * W;
    var sy = (-proj.y * 0.5 + 0.5) * H;

    var t  = (dot + 1) / 2;             /* 0.5..1 когда спереди */
    var sc = 0.65 + t * 0.35;           /* масштаб */
    var op = Math.max(0, (dot - 0.05) / 0.95); /* плавно гасим у края */

    cardEls[i].style.visibility = 'visible';
    cardEls[i].style.pointerEvents = op > 0.4 ? 'auto' : 'none';
    cardEls[i].style.opacity = op.toFixed(3);
    cardEls[i].style.zIndex  = Math.round(dot * 100);
    cardEls[i].style.left    = sx + 'px';
    cardEls[i].style.top     = sy + 'px';
    cardEls[i].style.transform = 'translate(-50%,-50%) scale(' + sc.toFixed(4) + ')';
  }
}

/* ── Resize ── */
window.addEventListener('resize', function(){
  W = window.innerWidth; H = window.innerHeight;
  camera.aspect = skyCamera.aspect = W / H;
  camera.updateProjectionMatrix();
  skyCamera.updateProjectionMatrix();
  renderer.setSize(W, H);
});

/* ── Controls ── */
var qT=new THREE.Quaternion(), qC=new THREE.Quaternion();
var _e=new THREE.Euler(), _q1=new THREE.Quaternion(), _q2=new THREE.Quaternion();
var gyroOn=false, SLERP=0.07;
var dy=0, dp=0.05, dn=false, lx=null, ly=null;
_e.set(dp,dy,0,'YXZ'); qT.setFromEuler(_e);

function screenAngle(){ return (window.screen&&window.screen.orientation)?(window.screen.orientation.angle||0):(window.orientation||0); }
function onOri(e){
  if(e.alpha===null) return; gyroOn=true;
  _e.set(THREE.MathUtils.degToRad(e.beta),THREE.MathUtils.degToRad(e.alpha),-THREE.MathUtils.degToRad(e.gamma),'YXZ');
  qT.setFromEuler(_e);
  _q1.setFromAxisAngle(new THREE.Vector3(1,0,0),-Math.PI/2); qT.multiply(_q1);
  _q2.setFromAxisAngle(new THREE.Vector3(0,0,1),THREE.MathUtils.degToRad(screenAngle())); qT.multiply(_q2);
}
function startGyro(){
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(function(s){if(s==='granted')window.addEventListener('deviceorientation',onOri,true);}).catch(function(){});
  } else { window.addEventListener('deviceorientation',onOri,true); }
}
var permDone=false;
document.addEventListener('touchstart',function(){if(!permDone){permDone=true;startGyro();}},{once:true});
startGyro();

canvas.addEventListener('mousedown',function(e){dn=true;lx=e.clientX;ly=e.clientY;});
window.addEventListener('mouseup',function(){dn=false;});
window.addEventListener('mousemove',function(e){
  if(!dn||gyroOn) return;
  dy-=(e.clientX-lx)*0.003; dp-=(e.clientY-ly)*0.003;
  dp=Math.max(-0.5,Math.min(1.4,dp)); lx=e.clientX; ly=e.clientY;
  _e.set(dp,dy,0,'YXZ'); qT.setFromEuler(_e);
});
var tx=null, ty=null;
canvas.addEventListener('touchstart',function(e){if(!gyroOn){var t=e.touches[0];tx=t.clientX;ty=t.clientY;}},{passive:true});
canvas.addEventListener('touchmove',function(e){
  if(gyroOn) return; var t=e.touches[0];
  if(tx!==null){dy-=(t.clientX-tx)*0.004;dp-=(t.clientY-ty)*0.004;dp=Math.max(-0.5,Math.min(1.4,dp));_e.set(dp,dy,0,'YXZ');qT.setFromEuler(_e);}
  tx=t.clientX; ty=t.clientY;
},{passive:true});

setTimeout(function(){var h=document.getElementById('hint');if(h)h.style.opacity='0';},3500);

/* ── Render loop ── */
var animId = null;
function animate(){
  animId = requestAnimationFrame(animate);

  /* 1. обновляем quaternion камеры */
  qC.slerp(qT, SLERP);
  camera.quaternion.copy(qC);
  skyCamera.quaternion.copy(qC);

  /* 2. сразу обновляем матрицы и позиции карточек */
  updateCards();

  /* 3. рендерим небо */
  renderer.clear();
  renderer.render(skyScene, skyCamera);
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){cancelAnimationFrame(animId);animId=null;}
  else if(!animId) animate();
});
animate();

})();
</script>
</body>
</html>
